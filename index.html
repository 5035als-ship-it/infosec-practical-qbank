수신 메일의 정당성을 검증하는 방법\n3-1) DKIM에서 전자서명을 하는 주체\n3-2) DKIM에서 키(공개키)를 공유하는 방법\n4) SPF와 DKIM을 결합해 정책·보고까지 정의한 기술의 이름"}, {"id": "16-실14", "round": 16, "meta": "2020.12.12, 당시 최난도", "type": "실무형", "no": 14, "q": "XML 코드", "a": "XXE, Billion Laughs(DoS)", "tags": ["웹보안", "네트워크"], "full": "다음 두 XML 코드에 대해 답하시오.\n```\n[코드1]\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<!DOCTYPE foo [\n  <!ELEMENT foo ANY >\n  <!ENTITY xxe SYSTEM \"file:///etc/passwd\" >]>\n<foo>&xxe;<\/foo>\n\n[코드2]\n<?xml version=\"1.0\"?>\n<!DOCTYPE lolz [\n  <!ENTITY lol \"lol\">\n  <!ENTITY lol2 \"&lol;&lol;&lol;&lol;&lol;&lol;&lol;&lol;\">\n  <!ENTITY lol3 \"&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;\">\n  ...\n  <!ENTITY lol9 \"&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;\">\n]>\n<lolz>&lol9;<\/lolz>\n```\n1) 코드1은 어떤 공격인가?\n2) 코드1의 공격 원리는?\n3) 코드2를 실행하면 어떤 결과가 생기는가?"}, {"id": "16-실15", "round": 16, "meta": "2020.12.12, 당시 최난도", "type": "실무형", "no": 15, "q": "정량 위험평가 계산", "a": "SLE·ALE·보호대책 효과 → 효과 큰 B 선택", "tags": ["위험관리"], "full": "두 가지 보호대책(A, B)의 위험평가 결과이다. 물음에 답하시오.\n```\n[A 적용 시]  AV=100,000 / EF=0.2 / ARO=0.5\n            SLE=( 1 ) / ALE=( 3 )\n            대책 적용으로 감소한 ALE=30,000 / 대책 운영비=17,000\n            대책 효과(가치)=( 5 )\n[B 적용 시]  AV=100,000 / EF=0.8 / ARO=0.25\n            SLE=( 2 ) / ALE=( 4 )\n            대책 적용으로 감소한 ALE=20,000 / 대책 운영비=4,000\n            대책 효과(가치)=( 6 )\n```\n1) (1)~(6)을 계산하시오.\n2) 두 대책 중 더 적절한 것을 고르고 이유를 설명하시오."}, {"id": "16-실16", "round": 16, "meta": "2020.12.12, 당시 최난도", "type": "실무형", "no": 16, "q": "개인정보 흐름표 문제", "a": "주민번호 근거 없음, MD5, 평문 전송, 영구 보관", "tags": ["개인정보·법규"], "full": "어느 공공기관의 개인정보 흐름표이다. 문제가 되는 사항 4가지를 찾아 설명하시오.\n```\n1) 수집 : 성명, 주민등록번호, 전화번호, 이메일 / 주민번호 수집 근거 : 정보주체 동의\n2) 저장 : 위 항목 저장 / 암호화 항목 : 주민등록번호 / 알고리즘 : MD5\n3) 제공 : 주민등록번호를 DB 실시간 연동으로 제공 / 전송 시 평문\n4) 파기 : 영구 보관\n```"}, {"id": "15-단1", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 1, "q": "XSS 점검 스크립트", "a": "XSS, alert", "tags": ["웹보안"], "full": "웹 취약점에 대한 설명이다. 빈칸을 채우시오.\n( A )는 게시판·웹 메일 등에 삽입한 악성 스크립트로 화면을 깨뜨리거나 다른 사용자의 쿠키·개인정보를 빼가는 공격이다. 점검할 때 다음과 같은 스크립트를 쓸 수 있다.\n<script> ( B )(document.cookie) <\/script>"}, {"id": "15-단2", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 2, "q": "크롤링 제한", "a": "robots.txt", "tags": ["웹보안"], "full": "검색 로봇(크롤러)이 웹사이트를 수집하는 범위를 제한하는 파일 이름은?"}, {"id": "15-단3", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 3, "q": "DoS 기법", "a": "Land, Smurf, SYN Flooding", "tags": ["네트워크"], "full": "서비스 거부 공격에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 출발지 IP와 목적지 IP를 모두 공격 대상 IP로 똑같이 만든 패킷을 보냄\n- ( B ) : 출발지를 공격 대상 IP로 위조한 ICMP 요청을 브로드캐스트 주소로 보냄\n- ( C ) : SYN 패킷을 대량으로 보내 연결 대기열을 가득 채움"}, {"id": "15-단4", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 4, "q": "1900 포트 IoT 반사 공격", "a": "SSDP DRDoS", "tags": ["네트워크"], "full": "UDP 1900번 포트(SSDP)를 이용하는 반사(Reflection)형 DDoS로, 주로 IoT 기기가 악용되는 공격은?"}, {"id": "15-단5", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 5, "q": "대용량 오픈소스 IDS", "a": "Suricata, Snort", "tags": ["관제·IDS"], "full": "빈칸을 채우시오.\n( A )는 오픈소스 IDS/IPS로, 기존 ( B )의 장점을 받아들이면서 멀티스레드로 대용량 트래픽을 실시간 처리하는 데 특화되어 있다."}, {"id": "15-단6", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 6, "q": "접속기록 2년·다운로드 사유", "a": "고유식별정보, 민감정보, 내부관리계획", "tags": ["개인정보·법규"], "full": "「개인정보의 안전성 확보조치 기준」 제8조(접속기록 보관 및 점검)이다. 빈칸을 채우시오.\n① 접속기록은 1년 이상 보관한다. 다만 5만 명 이상의 정보주체를 처리하거나 ( A ) 또는 ( B )를 처리하는 시스템은 2년 이상 보관한다.\n② 접속기록은 월 1회 이상 점검하며, 개인정보 다운로드가 확인되면 ( C )으로 정한 바에 따라 사유를 반드시 확인한다."}, {"id": "15-단7", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 7, "q": "SSL 3.0 다운그레이드", "a": "POODLE", "tags": ["네트워크"], "full": "TLS 연결을 SSL 3.0으로 강제로 낮춘 뒤, SSL 3.0의 패딩 처리 취약점을 이용해 암호문을 해독하는 공격은?"}, {"id": "15-단8", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 8, "q": "ISMS-P 인증체계", "a": "방송통신위원회, KISA, 인증위원회", "tags": ["개인정보·법규"], "full": "ISMS-P 인증 체계에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 과기정통부·행안부와 함께 정책협의회를 구성하며, 법·제도 개선과 인증기관·심사기관 지정 담당\n- ( B ) : 인증서 발급, 인증심사원 양성과 자격 관리 담당\n- ( C ) : 인증심사 결과를 심의·의결하는 조직"}, {"id": "15-단9", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 9, "q": "위험 평가·완화 과정", "a": "위험관리", "tags": ["위험관리"], "full": "자산과 시스템의 위험을 평가하고, 수용 가능한 수준까지 위험을 줄일 대책을 마련하는 일련의 과정을 무엇이라 하는가?"}, {"id": "15-단10", "round": 15, "meta": "2020, 합격률 8.7%", "type": "단답형", "no": 10, "q": "VPN 프로토콜", "a": "L2F, PPTP, IPSec", "tags": ["네트워크"], "full": "VPN 프로토콜에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 시스코가 개발한 2계층 터널링 프로토콜\n- ( B ) : MS, 3Com 등이 공동 개발한 2계층 터널링 프로토콜\n- ( C ) : 3계층에서 보안을 제공하는 표준 프로토콜"}, {"id": "15-서11", "round": 15, "meta": "2020, 합격률 8.7%", "type": "서술형", "no": 11, "q": "ESP 터널모드", "a": "필드 도식, 암호화 범위, 인증 범위", "tags": ["네트워크"], "full": "[IP 헤더][TCP 헤더][데이터]로 이루어진 패킷을 IPSec ESP 터널 모드로 보낼 때,\n(1) 추가되는 필드를 포함한 패킷 구조를 그리시오.\n(2) 암호화되는 범위를 쓰시오.\n(3) 인증(무결성 보호)되는 범위를 쓰시오."}, {"id": "15-서12", "round": 15, "meta": "2020, 합격률 8.7%", "type": "서술형", "no": 12, "q": "삭제된 백도어", "a": "실행 후 파일 삭제 / cp /proc/PID/exe / history, /proc/PID/cmdline", "tags": ["시스템"], "full": "백도어가 실행 중인 것을 아래처럼 확인했지만, 해당 경로에 가 보니 파일이 없었다.\n```\n# ls -al /proc/5900\n... exe -> /경로/backdoor (deleted)\n```\n1) 파일 경로에서 백도어 파일이 보이지 않는 이유는?\n2) 삭제된 백도어를 /tmp/backdoor로 복구하는 명령어는?\n3) ps가 변조되어 쓸 수 없을 때, 공격자가 실행한 명령어를 확인하는 방법은?"}, {"id": "15-서13", "round": 15, "meta": "2020, 합격률 8.7%", "type": "서술형", "no": 13, "q": "비밀번호 작성규칙 3가지", "a": "21회와 동일", "tags": ["개인정보·법규"], "full": "정보통신망법 적용을 받는 회사가 비밀번호 작성 규칙을 정하려 한다. 「개인정보의 기술적·관리적 보호조치 기준」에 따른 비밀번호 작성 규칙 3가지를 설명하시오."}, {"id": "15-실14", "round": 15, "meta": "2020, 합격률 8.7%", "type": "실무형", "no": 14, "q": "백업 파일 권한", "a": "타 계정 읽기 가능 / umask 변경·복원 / chown operator + chmod 700", "tags": ["시스템"], "full": "다음 백업 스크립트와 결과 파일에 대해 답하시오.\n```\n[백업 스크립트]\n#!/bin/sh\ntar -cvzf /data/backup/etc_$dat.tgz /etc/*\ntar -cvzf /data/backup/home_$dat.tgz /home/*\n\n[결과 파일 권한]\n-rw-r--r--  root  root  /data/backup/etc_YYYYMMDD.tgz\n-rw-r--r--  root  root  /data/backup/home_YYYYMMDD.tgz\n```\n1) 결과 파일 권한의 문제점은?\n2) 스크립트에서 umask를 바꿔 백업 파일을 만든 뒤 원래 umask로 되돌리도록 작성하시오.\n3) operator 사용자만 /usr/local/bin/backup 스크립트를 쓸 수 있게 하는 명령어와 의미를 쓰시오."}, {"id": "15-실15", "round": 15, "meta": "2020, 합격률 8.7%", "type": "실무형", "no": 15, "q": "Content-Length 큰 POST, 1바이트 전송", "a": "Slow HTTP POST(RUDY) / 연결·읽기 타임아웃, 동시 연결 제한", "tags": ["웹보안"], "full": "패킷 분석 도구로 캡처한 HTTP 요청이다. 물음에 답하시오.\n```\n[캡처 1]\nPOST / HTTP/1.1\n...\nContent-Length: 1000000\n\n[캡처 2]\n...\nTCP segment data (1 byte)\n```\n1) 어떤 공격인가?\n2) 그렇게 판단한 근거를 구체적으로 쓰시오.\n3) 서버 측 대응 방안 2가지는?"}, {"id": "15-실16", "round": 15, "meta": "2020, 합격률 8.7%", "type": "실무형", "no": 16, "q": "교통카드 신청서 위반", "a": "주민번호 수집·제공, 영구보관, 거부권 미고지, 제공기관 불명확", "tags": ["개인정보·법규"], "full": "어느 시의 어르신 교통카드 신청서 안내 내용이다. 개인정보 보호법 위반 사항 4가지를 찾아 설명하시오.\n```\n1) 수집·이용(필수) : 항목(주민등록번호 포함), 목적(본인 확인), 보유기간(영구)\n   ※ 동의 거부 권리와 거부 시 불이익 안내함\n2) 제3자 제공 : 제공처(유관기관), 항목(주민등록번호 포함), 목적, 기간(카드 만료 시까지)\n3) 처리 위탁 : 수탁자(OO신용카드), 업무(교통카드 발급)\n4) 위 3가지에 대해 일괄 동의 요청\n```"}, {"id": "14-단1", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 1, "q": "접근통제", "a": "MAC, DAC, RBAC", "tags": ["보안일반"], "full": "접근통제 모델에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 객체의 비밀 등급과 주체의 허가 등급으로 접근 통제\n- ( B ) : 사용자·그룹 신원에 근거해 소유자가 권한 결정\n- ( C ) : 역할에 따라 권한 부여"}, {"id": "14-단2", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 2, "q": "ARP 목적지", "a": "ff:ff:ff:ff:ff:ff", "tags": ["네트워크"], "full": "ARP에서 목적지의 MAC 주소를 알아내기 위해 보내는 요청 프레임의 목적지 주소를 형식에 맞게 쓰시오."}, {"id": "14-단3", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 3, "q": "IPSec", "a": "네트워크 계층, AH, ESP", "tags": ["네트워크"], "full": "IPSec에 대해 답하시오.\n(1) 동작하는 계층은? ( A )\n(2) 무결성·인증을 보장하는 세부 프로토콜은? ( B )\n(3) 기밀성(암호화)을 제공하는 세부 프로토콜은? ( C )"}, {"id": "14-단4", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 4, "q": "MS 오피스 프로토콜", "a": "DDE", "tags": ["시스템"], "full": "MS 오피스와 다른 애플리케이션 간에 데이터를 주고받는 프로토콜로, 엑셀에서 활성화되면 악용될 수 있는 것은?"}, {"id": "14-단5", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 5, "q": "사이버위기 경보", "a": "관심, 경계, 심각", "tags": ["관제·IDS"], "full": "국가 사이버위기 경보 단계이다. 빈칸을 채우시오.\n정상 → ( A ) → 주의 → ( B ) → ( C )"}, {"id": "14-단6", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 6, "q": "리눅스 로그", "a": "utmp, wtmp, btmp", "tags": ["시스템"], "full": "리눅스 로그 파일에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 현재 로그인한 사용자 정보\n- ( B ) : 로그인·로그아웃·재부팅 이력\n- ( C ) : 로그인 실패 기록"}, {"id": "14-단7", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 7, "q": "정보보호제품 국제 인증", "a": "CC 인증", "tags": ["보안일반"], "full": "정보보호 제품의 보안성을 평가·인증하는 국제 공통평가기준 인증의 이름은?"}, {"id": "14-단8", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 8, "q": "업로드 크기 제한", "a": "LimitRequestBody", "tags": ["웹보안"], "full": "Apache httpd.conf에서 디렉터리별 업로드(요청 본문) 최대 크기를 제한하는 지시자는?"}, {"id": "14-단9", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 9, "q": "법률 명칭", "a": "정보통신망법, 정보통신기반보호법, 위치정보법", "tags": ["개인정보·법규"], "full": "정보보호 관련 법률의 약칭을 쓰시오.\n- ( A ) : 정보통신망 이용촉진 및 정보보호 등에 관한 법률\n- ( B ) : 주요 정보통신기반시설 보호에 관한 법률\n- ( C ) : 위치정보의 보호 및 이용 등에 관한 법률"}, {"id": "14-단10", "round": 14, "meta": "2019, 합격률 10%", "type": "단답형", "no": 10, "q": "ISMS-P 1.2.1·1.2.3", "a": "중요도, 위협정보, 경영진", "tags": ["위험관리", "개인정보·법규"], "full": "ISMS-P 인증 기준의 일부이다. 빈칸을 채우시오.\n- 1.2.1 정보자산 식별 : 분류 기준을 세워 범위 내 모든 정보자산을 식별·분류하고, ( A )를 산정해 목록을 최신으로 관리\n- 1.2.3 위험 평가 : 대내외 환경 분석으로 유형별 ( B )를 수집하고, 연 1회 이상 위험을 평가하며, 수용 가능한 위험은 ( C )의 승인을 받아 관리"}, {"id": "14-서11", "round": 14, "meta": "2019, 합격률 10%", "type": "서술형", "no": 11, "q": "계정 임계값 옵션", "a": "deny, unlock_time, no_magic_root, reset", "tags": ["시스템"], "full": "PAM 계정 잠금 임계값 설정에 쓰인 다음 옵션의 의미를 각각 설명하시오.\ndeny=5, unlock_time=120, no_magic_root, reset"}, {"id": "14-서12", "round": 14, "meta": "2019, 합격률 10%", "type": "서술형", "no": 12, "q": "/etc/shadow", "a": "알고리즘·salt·해시, salt로 레인보우 테이블 대응, pwunconv", "tags": ["시스템"], "full": "/etc/shadow에 대해 답하시오.\n1) 패스워드 필드 $a$b$c 에서 a, b, c는 각각 무엇인가?\n2) b가 레인보우 테이블 공격을 막을 수 있는 이유는?\n3) pwunconv 명령의 기능은?"}, {"id": "14-서13", "round": 14, "meta": "2019, 합격률 10%", "type": "서술형", "no": 13, "q": "강제적 접근통제", "a": "BLP, no read up, no write down, Biba no write up", "tags": ["보안일반"], "full": "강제적 접근통제(MAC) 모델에 대해 답하시오.\n1) 무결성보다 기밀성 유지에 초점을 둔 모델의 이름은?\n2) No Read Up의 의미는?\n3) No Write Down의 의미와 보안상 의의는?\n4) Biba 모델의 쓰기(write) 정책은?"}, {"id": "14-실14", "round": 14, "meta": "2019, 합격률 10%", "type": "실무형", "no": 14, "q": "ACK 스캔", "a": "방화벽 필터링 여부 판별, RST 온 포트는 미필터링", "tags": ["네트워크"], "full": "A 시스템이 B 시스템의 2012~2018번 포트로 ACK 패킷을 보냈더니 2017번 포트에서만 RST 응답이 왔다.\n1) 어떤 스캔인가?\n2) 이 스캔의 목적은?\n3) 이 결과로 알 수 있는 것은?"}, {"id": "14-실15", "round": 14, "meta": "2019, 합격률 10%", "type": "실무형", "no": 15, "q": "아파치 옵션", "a": "Timeout, MaxKeepAliveRequests, DirectoryIndex, ErrorLog", "tags": ["웹보안"], "full": "Apache 설정의 다음 지시자 의미를 설명하시오.\n1) Timeout 300\n2) MaxKeepAliveRequests 100\n3) DirectoryIndex index.htm index.html index.php\n4) ErrorLog \"경로\""}, {"id": "14-실16", "round": 14, "meta": "2019, 합격률 10%", "type": "실무형", "no": 16, "q": "XSS Snort 룰", "a": "offset·depth, distance, offset 0 + nocase로 수정", "tags": ["웹보안", "관제·IDS"], "full": "XSS 공격을 탐지하기 위한 다음 Snort 룰에 대해 답하시오.\n```\nalert tcp any any -> any 80 (msg:\"XSS\"; content:\"GET\"; offset:1; depth:3; content:\"/login.php<script>XSS\"; distance:1;)\n```\n1) content:\"GET\"; offset:1; depth:3; 의 의미는?\n2) content:\"/login.php<script>XSS\"; distance:1; 의 의미는?\n3) 실제 패킷이 \"GET /Login.php<script>XSS\"처럼 맨 앞에서 시작하고 L이 대문자라 탐지되지 않는다면, 룰을 어떻게 고쳐야 하는가?"}, {"id": "13-단1", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 1, "q": "Victim MAC 위조", "a": "ARP 스푸핑", "tags": ["네트워크"], "full": "피해자(Victim)의 MAC 주소를 위조해 트래픽을 가로채는 스니핑 공격은?"}, {"id": "13-단2", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 2, "q": "분야별 실시간 경보·분석 기관", "a": "ISAC", "tags": ["관제·IDS"], "full": "금융·통신 등 분야별로 침해사고 정보를 공유하고 실시간 경보·분석 체계를 운영하여 주요 정보통신기반시설을 보호하는 기관은?"}, {"id": "13-단3", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 3, "q": "침입탐지 정책", "a": "오용탐지, 이상탐지, 오탐/미탐", "tags": ["관제·IDS"], "full": "IDS의 탐지 방식에 대해 답하시오.\n(1) 미리 등록한 공격 패턴(시그니처)과 비교해 탐지하는 기법은?\n(2) 정상 행위를 프로파일링하고 통계적으로 벗어나는 행위를 탐지하는 기법은?\n(3) 정상을 공격으로 판단하는 것과, 공격을 놓치는 것을 각각 무엇이라 하는가?"}, {"id": "13-단4", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 4, "q": "GitHub DDoS 캐시", "a": "Memcached", "tags": ["네트워크", "관제·IDS"], "full": "GitHub를 대상으로 한 대규모 반사·증폭 DDoS 공격에 악용된 분산 메모리 캐시 솔루션은?"}, {"id": "13-단5", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 5, "q": "패스워드 정책 파일", "a": "login.defs", "tags": ["시스템"], "full": "리눅스 /etc 아래에 있으며, 패스워드 최대 사용 기간·최소 변경 기간·만료 경고 등 패스워드 정책을 설정하는 파일은?"}, {"id": "13-단6", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 6, "q": "소스 미확인/확인", "a": "블랙박스, 화이트박스", "tags": ["웹보안"], "full": "소스 코드를 보지 않고 외부 인터페이스만으로 취약점을 찾는 방식을 (1), 소스 코드를 직접 검토해 취약점을 찾는 방식을 (2)라 한다. 빈칸을 채우시오."}, {"id": "13-단7", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 7, "q": "정성적 위험분석", "a": "시나리오법, 델파이법", "tags": ["위험관리"], "full": "정성적 위험분석 기법 2가지의 이름을 쓰시오.\n(1) 사건이 기대대로 일어나지 않는다는 전제에서 특정 조건의 발생 가능한 결과를 추정하는 기법\n(2) 전문가 집단의 토론으로 위험과 취약성을 분석하는 기법"}, {"id": "13-단8", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 8, "q": "보험 가입", "a": "위험 전가", "tags": ["위험관리"], "full": "보험 가입처럼 자산에 대한 위험 부담을 제3자에게 넘기는 위험 처리 방식은?"}, {"id": "13-단9", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 9, "q": "기본 보호 수준 설정", "a": "기준(베이스라인) 접근법", "tags": ["위험관리"], "full": "모든 시스템에 기본 보호 수준을 정하고 이를 달성할 보호대책을 선택하는 위험분석 접근법은?"}, {"id": "13-단10", "round": 13, "meta": "2019.05.25", "type": "단답형", "no": 10, "q": "비즈니스 연속성 계획", "a": "BCP", "tags": ["위험관리"], "full": "재해나 장애가 발생해도 핵심 업무가 계속되도록 보장하기 위한 계획을 무엇이라 하는가?"}, {"id": "13-서11", "round": 13, "meta": "2019.05.25", "type": "서술형", "no": 11, "q": ".htaccess", "a": "FilesMatch, AddType", "tags": ["웹보안"], "full": "파일 업로드 취약점 대응을 위한 .htaccess 설정의 의미를 설명하시오.\n```\n(1) <FilesMatch \"\\.(ph|lib|sh)\">\n        Order Allow,Deny\n        Deny from all\n    <\/FilesMatch>\n(2) AddType text/html .php .php3 .php4 .phtml\n```"}, {"id": "13-서12", "round": 13, "meta": "2019.05.25", "type": "서술형", "no": 12, "q": "IDS 미러 / IPS 인라인 이유", "a": "IPS 실시간 차단·경계 배치, IDS 업무 영향 없음", "tags": ["위험관리", "관제·IDS"], "full": "IDS는 내부 트래픽을 미러링 방식으로 받아 쓰고, IPS는 인라인 방식으로 외부와 내부의 경계에 두는 이유를 설명하시오."}, {"id": "13-서13", "round": 13, "meta": "2019.05.25", "type": "서술형", "no": 13, "q": "IPSec 모드별 범위", "a": "AH/ESP × 전송/터널 인증·암호화 구간, IKE", "tags": ["네트워크"], "full": "IPSec의 AH와 ESP를 전송 모드와 터널 모드로 쓸 때 각각의 인증 범위와 암호화 범위를 설명하고, 키 교환 프로토콜의 이름을 쓰시오."}, {"id": "13-실14", "round": 13, "meta": "2019.05.25", "type": "실무형", "no": 14, "q": "하트블리드 Snort 룰", "a": "포트, content 바이트 검사 의미", "tags": ["웹보안", "관제·IDS"], "full": "하트블리드 공격을 탐지하는 다음 Snort 룰의 (1)~(6)의 의미를 설명하시오.\n```\nalert tcp any any <> any (1)[443,465,523]\n  ((2)content:\"|18 03 00|\"; depth:3;\n   (3)content:\"|01|\"; distance:2; within:1;\n   (4)content:!\"|00|\"; within:1;\n   (5)msg:\"SSLv3 Malicious Heartbleed Request V2\";\n   (6)sid:1;)\n```"}, {"id": "13-실15", "round": 13, "meta": "2019.05.25", "type": "실무형", "no": 15, "q": "디렉터리 인덱싱", "a": "200 OK + index of, Indexes 삭제", "tags": ["웹보안"], "full": "다음 요청과 응답을 보고 물음에 답하시오.\n```\n[요청]\nGET /cgi/bin/ HTTP/1.1\nHost: example.com\n\n[응답]\nHTTP/1.1 200 OK\nServer: Apache/2.4.58 (Unix)\nContent-Type: text/html\n<html><head><title>Index of /cgi/bin<\/title><\/head>\n<body><h1>Index of /cgi/bin<\/h1>\n<ul><li>logo.png<\/li><li>backup.zip<\/li><li>test/<\/li><\/ul>\n<\/body><\/html>\n```\n(1) 어떤 공격(취약점)인가?\n(2) 공격이 성공했다고 볼 수 있는 근거는?\n(3) Apache 설정 파일에서의 조치 방법은?"}, {"id": "13-실16", "round": 13, "meta": "2019.05.25", "type": "실무형", "no": 16, "q": "robots.txt", "a": "크롤러 접근 제어 용도·설정 의미", "tags": ["웹보안"], "full": "robots.txt에 대해 답하시오.\n(1) robots.txt 파일의 용도는?\n(2) 다음 설정 (가)~(다)의 의미를 설명하시오.\n```\nUser-agent: Yeti\nUser-agent: Googlebot\n(가) Allow: /\nUser-agent: Googlebot-Image\n(나) Disallow: /admin/\n(다) Disallow: /*.pdf$\n```"}];
</script>
<script>
(function(){
  const Q = window.QUESTIONS || [];
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let marks = store.get('qb.marks', {});           // id -> 'known' | 'unknown'
  const state = {
    tab: 'bank', round: 'all', search: '', types: new Set(), tags: new Set(), status: 'all',
    showAll: false, open: new Set(),
    quiz: { list: [], idx: 0, shown: false, onlyWrong: false }
  };

  // ---------- theme ----------
  const savedTheme = store.get('qb.theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); store.set('qb.theme', next);
  };

  // ---------- filters UI ----------
  $('#total').textContent = Q.length;
  const rounds = [...new Set(Q.map(q => q.round))].sort((a,b) => b-a);
  const sel = $('#fRound');
  sel.innerHTML = '<option value="all">전체 회차</option><option value="recent">최근 3년 (24~29회)</option>'
    + rounds.map(r => { const m = (Q.find(q => q.round===r).meta||'').split(',')[0]; return `<option value="${r}">${r}회${m ? ' · '+m : ''}</option>`; }).join('');
  sel.onchange = () => { state.round = sel.value; refresh(true); };
  $('#fSearch').oninput = e => { state.search = e.target.value.trim().toLowerCase(); refresh(true); };

  function chips(container, values, set){
    values.forEach(v => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = v; b.setAttribute('aria-pressed','false');
      b.onclick = () => { set.has(v) ? set.delete(v) : set.add(v); b.setAttribute('aria-pressed', set.has(v)); refresh(true); };
      container.appendChild(b);
    });
  }
  chips($('#fType'), ['단답형','서술형','실무형'], state.types);
  const tagOrder = ['위험관리','웹보안','네트워크','시스템','개인정보·법규','관제·IDS','메일보안','보안일반'];
  const tagsPresent = tagOrder.filter(t => Q.some(q => q.tags.includes(t)));
  chips($('#fTag'), tagsPresent, state.tags);

  const statusOpts = [['all','전체'],['none','안 푼 문제'],['known','알았음'],['unknown','몰랐음']];
  const fs = $('#fStatus'); fs.className = 'row'; fs.style.gap = '6px';
  statusOpts.forEach(([v, label]) => {
    const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=label;
    b.setAttribute('aria-pressed', v==='all'); b.dataset.v = v;
    b.onclick = () => { state.status = v; fs.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v===v)); refresh(true); };
    fs.appendChild(b);
  });

  function filtered(){
    return Q.filter(q => {
      if (state.round === 'recent' && q.round < 24) return false;
      if (state.round !== 'all' && state.round !== 'recent' && q.round !== +state.round) return false;
      if (state.types.size && !state.types.has(q.type)) return false;
      if (state.tags.size && !q.tags.some(t => state.tags.has(t))) return false;
      const m = marks[q.id];
      if (state.status === 'none' && m) return false;
      if ((state.status === 'known' || state.status === 'unknown') && m !== state.status) return false;
      if (state.search && !(q.q + ' ' + q.full + ' ' + q.a + ' ' + q.tags.join(' ')).toLowerCase().includes(state.search)) return false;
      return true;
    });
  }

  // ---------- rendering helpers ----------
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function answerHTML(a){
    const parts = a.split(/\s\/\s/).map(s => s.trim()).filter(Boolean);
    return parts.length > 1 ? '<ul>' + parts.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>' : esc(a);
  }
  function fullHTML(t){
    const out=[]; const parts=t.split(/```/);
    parts.forEach((seg,i)=>{
      if(i%2===1){ out.push('<pre><code>'+esc(seg.replace(/^\n|\n$/g,''))+'</code></pre>'); return; }
      seg.split('\n').forEach(line=>{ if(line.trim()) out.push('<p>'+esc(line)+'</p>'); });
    });
    return out.join('');
  }
  function markLabel(id){
    const m = marks[id];
    return m === 'known' ? '✓ 알았음' : m === 'unknown' ? '✗ 몰랐음' : '';
  }
  function setMark(id, v){
    if (marks[id] === v) delete marks[id]; else marks[id] = v;
    store.set('qb.marks', marks); updateCounts();
  }
  function cardHTML(q, open){
    const m = marks[q.id] || '';
    return `<article class="card ${m}" data-id="${q.id}">
      <div class="meta"><span class="badge">${q.round}회 ${q.type} ${q.no}번</span>
        ${q.tags.map(t => `<span class="tag">#${t}</span>`).join(' ')}</div>
      <div class="qbody">${fullHTML(q.full)}</div>
      <div class="actions">
        <button class="btn primary" data-act="toggle" type="button" aria-expanded="${open}">${open ? '정답 감추기' : '정답 보기'}</button>
        <button class="btn ok" data-act="known" type="button">알았음</button>
        <button class="btn bad" data-act="unknown" type="button">몰랐음</button>
        <span class="mark-state">${markLabel(q.id)}</span>
      </div>
      <div class="answer" ${open ? '' : 'hidden'}><div class="topic">주제: ${esc(q.q)}</div>${answerHTML(q.a)}</div>
    </article>`;
  }
  function bindList(el, rerender){
    el.onclick = e => {
      const btn = e.target.closest('button[data-act]'); if (!btn) return;
      const card = btn.closest('.card'); const id = card.dataset.id; const act = btn.dataset.act;
      if (act === 'toggle'){
        const ans = card.querySelector('.answer'); const show = ans.hidden;
        ans.hidden = !show; btn.textContent = show ? '정답 감추기' : '정답 보기'; btn.setAttribute('aria-expanded', show);
        show ? state.open.add(id) : state.open.delete(id);
      } else {
        setMark(id, act);
        card.classList.remove('known','unknown'); if (marks[id]) card.classList.add(marks[id]);
        card.querySelector('.mark-state').textContent = markLabel(id);
        if (rerender) rerender();
      }
    };
  }

  // ---------- bank ----------
  const PAGE = 60; let bankLimit = PAGE;
  function renderBank(){
    const list = filtered();
    $('#bankInfo').textContent = `${list.length}문항`;
    const shown = list.slice(0, bankLimit);
    $('#bankList').innerHTML = shown.length
      ? shown.map(q => cardHTML(q, state.showAll || state.open.has(q.id))).join('')
        + (list.length > bankLimit ? `<button class="btn" id="more" type="button" style="justify-self:center">더 보기 (${list.length - bankLimit}개 남음)</button>` : '')
      : '<div class="empty">조건에 맞는 문제가 없어요.</div>';
    const more = $('#more'); if (more) more.onclick = () => { bankLimit += PAGE; renderBank(); };
    $('#toggleAll').textContent = state.showAll ? '전체 정답 감추기' : '전체 정답 보기';
  }
  bindList($('#bankList'));
  $('#toggleAll').onclick = () => { state.showAll = !state.showAll; if (!state.showAll) state.open.clear(); renderBank(); };

  // ---------- quiz ----------
  function buildQuiz(shuffle){
    let list = state.quiz.onlyWrong ? Q.filter(q => marks[q.id] === 'unknown') : filtered();
    list = list.slice();
    if (shuffle) for (let i = list.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [list[i], list[j]] = [list[j], list[i]]; }
    state.quiz.list = list; state.quiz.idx = 0; state.quiz.shown = false;
  }
  function renderQuiz(){
    const { list, idx, shown } = state.quiz;
    $('#quizInfo').textContent = (state.quiz.onlyWrong ? '오답노트 · ' : '') + (list.length ? `${idx+1} / ${list.length}` : '0문항');
    $('#progressBar').style.width = list.length ? ((idx+1)/list.length*100) + '%' : '0';
    if (!list.length){ $('#quizBox').innerHTML = '<div class="card empty">풀 문제가 없어요. 필터를 바꿔 보세요.</div>'; return; }
    const q = list[idx]; const m = marks[q.id] || '';
    $('#quizBox').innerHTML = `<article class="card quiz-card ${m}">
      <div class="meta"><span class="badge">${q.round}회 ${q.type} ${q.no}번</span>
        ${q.tags.map(t => `<span class="tag">#${t}</span>`).join(' ')}
        <span class="mark-state">${markLabel(q.id)}</span></div>
      <div class="qbody">${fullHTML(q.full)}</div>
      <div class="actions"><button class="btn primary" id="qToggle" type="button" aria-expanded="${shown}">${shown ? '정답 감추기' : '정답 보기'}</button></div>
      <div class="answer" ${shown ? '' : 'hidden'}><div class="topic">주제: ${esc(q.q)}</div>${answerHTML(q.a)}</div>
      <div class="quiz-nav">
        <div class="grp"><button class="btn" id="qPrev" type="button" ${idx===0?'disabled':''}>← 이전</button>
          <button class="btn" id="qNext" type="button" ${idx===list.length-1?'disabled':''}>다음 →</button></div>
        <div class="grp"><button class="btn ok" id="qKnown" type="button">알았음 (1)</button>
          <button class="btn bad" id="qUnknown" type="button">몰랐음 (2)</button></div>
      </div></article>`;
    $('#qToggle').onclick = toggleQuiz; $('#qPrev').onclick = () => go(-1); $('#qNext').onclick = () => go(1);
    $('#qKnown').onclick = () => markQuiz('known'); $('#qUnknown').onclick = () => markQuiz('unknown');
  }
  function toggleQuiz(){ state.quiz.shown = !state.quiz.shown; renderQuiz(); }
  function go(d){ const n = state.quiz.idx + d; if (n < 0 || n >= state.quiz.list.length) return; state.quiz.idx = n; state.quiz.shown = false; renderQuiz(); }
  function markQuiz(v){
    const q = state.quiz.list[state.quiz.idx]; if (!q) return;
    marks[q.id] = v; store.set('qb.marks', marks); updateCounts();
    if (state.quiz.idx < state.quiz.list.length - 1) go(1); else renderQuiz();
  }
  $('#shuffleBtn').onclick = () => { buildQuiz(true); renderQuiz(); };
  $('#orderBtn').onclick = () => { buildQuiz(false); renderQuiz(); };
  document.addEventListener('keydown', e => {
    if (state.tab !== 'quiz' || e.target.matches('input,select,textarea')) return;
    if (e.key === ' '){ e.preventDefault(); toggleQuiz(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === '1') markQuiz('known');
    else if (e.key === '2') markQuiz('unknown');
  });

  // ---------- wrong note ----------
  function renderWrong(){
    const list = Q.filter(q => marks[q.id] === 'unknown');
    $('#wrongInfo').textContent = `몰랐음으로 표시한 ${list.length}문항`;
    $('#wrongList').innerHTML = list.length ? list.map(q => cardHTML(q, state.open.has(q.id))).join('')
      : '<div class="empty">아직 오답이 없어요. 문제를 풀면서 "몰랐음"을 누르면 여기에 모입니다.</div>';
  }
  bindList($('#wrongList'), () => renderWrong());
  $('#wrongQuiz').onclick = () => { state.quiz.onlyWrong = true; buildQuiz(true); switchTab('quiz', true); };
  $('#resetMarks').onclick = () => { if (confirm('알았음/몰랐음 기록을 모두 지울까요?')){ marks = {}; store.set('qb.marks', marks); updateCounts(); refresh(true); } };

  // ---------- tabs & counts ----------
  function updateCounts(){
    const k = Object.values(marks).filter(v => v==='known').length;
    const u = Object.values(marks).filter(v => v==='unknown').length;
    $('#wrongCount').textContent = u ? u : '';
    $('#stats').innerHTML = `<span>푼 문제 <b>${k+u}</b> / ${Q.length}</span><span>알았음 <b>${k}</b></span><span>몰랐음 <b>${u}</b></span>`;
  }
  function switchTab(t, keepQuiz){
    state.tab = t;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
    ['bank','quiz','wrong'].forEach(x => $('#tab-'+x).hidden = x !== t);
    document.querySelector('.filters').hidden = t === 'wrong';
    if (t === 'quiz' && !keepQuiz){ state.quiz.onlyWrong = false; buildQuiz(false); }
    store.set('qb.tab', t);
    refresh(false);
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  function refresh(filterChanged){
    if (filterChanged){ bankLimit = PAGE; if (state.tab === 'quiz'){ state.quiz.onlyWrong = false; buildQuiz(false); } }
    if (state.tab === 'bank') renderBank();
    else if (state.tab === 'quiz') renderQuiz();
    else renderWrong();
  }

  updateCounts();
  switchTab(store.get('qb.tab', 'bank'));
})();
</script>
</body>
</html>
