<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보보안기사 실기 문제은행</title>
<meta name="description" content="정보보안기사 실기 13~29회 복원 기출 문제은행 · 연속 풀기 · 오답노트">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --text:#1b1f24; --muted:#5f6b7a;
  --border:#dde2e8; --accent:#2f5bea; --accent-weak:#e6ecfd; --ok:#1f8a4c; --ok-weak:#e3f4ea;
  --bad:#c7362f; --bad-weak:#fbe7e6; --ans:#fff8e1; --ans-border:#f0d48a; --shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --surface:#171b21; --surface-2:#1f252d; --text:#e7ebf0; --muted:#98a3b3;
    --border:#2b323c; --accent:#7c9cff; --accent-weak:#1e2a4a; --ok:#4cc38a; --ok-weak:#16302a;
    --bad:#ff7a72; --bad-weak:#3a1d1c; --ans:#2a2414; --ans-border:#6b5a2a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1f252d; --text:#e7ebf0; --muted:#98a3b3;
  --border:#2b323c; --accent:#7c9cff; --accent-weak:#1e2a4a; --ok:#4cc38a; --ok-weak:#16302a;
  --bad:#ff7a72; --bad-weak:#3a1d1c; --ans:#2a2414; --ans-border:#6b5a2a; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 64px}
header h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
header p{margin:0;color:var(--muted);font-size:13.5px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{font-weight:500;font-size:12px;margin-left:4px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.filters{display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row-label{font-size:12.5px;color:var(--muted);width:44px;flex:none}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;line-height:1.5}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
select,input[type=search]{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:0}
input[type=search]{flex:1 1 180px}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:14px 2px 10px}
.toolbar .info{color:var(--muted);font-size:13.5px}
.btn{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1216}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1216}}
.btn.ok{color:var(--ok);border-color:var(--ok)} .btn.ok:hover{background:var(--ok-weak)}
.btn.bad{color:var(--bad);border-color:var(--bad)} .btn.bad:hover{background:var(--bad-weak)}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.card.known{border-left:4px solid var(--ok)} .card.unknown{border-left:4px solid var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:1px 8px}
.type{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:0 7px}
.tag{font-size:11.5px;color:var(--muted)}
.q{font-size:16px;font-weight:600;margin:2px 0 10px;word-break:keep-all;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qbody{font-size:15.5px;line-height:1.7;margin:4px 0 12px;word-break:keep-all;overflow-wrap:anywhere}
.qbody p{margin:0 0 6px;white-space:pre-wrap}
.qbody pre{margin:8px 0;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;word-break:normal}
.quiz-card .qbody{font-size:16.5px}
.topic{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.answer{margin-top:10px;background:var(--ans);border:1px solid var(--ans-border);border-radius:8px;padding:10px 12px;font-size:14.5px;overflow-wrap:anywhere}
.answer ul{margin:0;padding-left:18px}
.answer[hidden]{display:none}
.mark-state{font-size:12.5px;margin-left:auto;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* quiz */
.quiz-card{min-height:260px;display:flex;flex-direction:column}
.quiz-card .q{font-size:19px;margin:8px 0 16px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.quiz-nav{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:16px;flex-wrap:wrap}
.quiz-nav .grp{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--text)}
footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.6}
@media (max-width:560px){
  .row-label{width:100%}
  .quiz-card .q{font-size:17px}
  .tab{padding:10px 10px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>정보보안기사 실기 문제은행</h1>
      <p>13~29회 복원 기출 <span id="total"></span>문항 · 실제 시험처럼 지문을 읽고 풀어 보세요 · 정답은 기본으로 가려져 있어요</p>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="테마 전환">🌓 테마</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="bank" aria-selected="true">문제은행</button>
    <button class="tab" role="tab" data-tab="quiz" aria-selected="false">연속 풀기</button>
    <button class="tab" role="tab" data-tab="wrong" aria-selected="false">오답노트<span class="count" id="wrongCount"></span></button>
  </nav>

  <section class="panel filters" aria-label="필터">
    <div class="row">
      <span class="row-label">회차</span>
      <select id="fRound" aria-label="회차 선택"></select>
      <input type="search" id="fSearch" placeholder="키워드 검색 (예: IPSec, 쿠키, 위험)" aria-label="검색">
    </div>
    <div class="row" id="fType"><span class="row-label">유형</span></div>
    <div class="row" id="fTag"><span class="row-label">영역</span></div>
    <div class="row"><span class="row-label">상태</span>
      <span id="fStatus"></span>
    </div>
  </section>

  <!-- 문제은행 -->
  <section id="tab-bank">
    <div class="toolbar">
      <span class="info" id="bankInfo"></span>
      <div class="actions">
        <button class="btn" id="toggleAll" type="button">전체 정답 보기</button>
      </div>
    </div>
    <div class="list" id="bankList"></div>
  </section>

  <!-- 연속 풀기 -->
  <section id="tab-quiz" hidden>
    <div class="toolbar">
      <span class="info" id="quizInfo"></span>
      <div class="actions">
        <button class="btn" id="shuffleBtn" type="button">🔀 섞기</button>
        <button class="btn" id="orderBtn" type="button">↺ 순서대로</button>
      </div>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="quizBox"></div>
    <p class="hint">단축키: <b>Space</b> 정답 보기/감추기 · <b>← →</b> 이전/다음 · <b>1</b> 알았음 · <b>2</b> 몰랐음</p>
  </section>

  <!-- 오답노트 -->
  <section id="tab-wrong" hidden>
    <div class="toolbar">
      <span class="info" id="wrongInfo"></span>
      <div class="actions">
        <button class="btn" id="wrongQuiz" type="button">오답만 연속 풀기</button>
        <button class="btn bad" id="resetMarks" type="button">기록 초기화</button>
      </div>
    </div>
    <div class="list" id="wrongList"></div>
  </section>

  <footer>
    <div class="stats" id="stats"></div>
    <p>문항은 수험생 복원본(네이버 블로그 stereok2 회차별 문제분석)을 참고해 지문을 다시 쓰고 정답은 핵심 키워드로 요약한 것이라 실제 시험지와 다를 수 있습니다. 서술형은 키워드를 보고 직접 문장으로 답안을 써 보세요. 학습 기록은 이 브라우저에만 저장됩니다.</p>
  </footer>
</div>

<script>
window.QUESTIONS = [{"id": "29-단1", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 1, "q": "리눅스 PAM 모듈", "a": "account, auth, session", "tags": ["시스템"], "full": "리눅스 PAM(Pluggable Authentication Module)의 모듈 타입을 설명한 것이다. 빈칸 (A)~(C)에 알맞은 모듈 타입을 쓰시오.\n- ( A ) : 사용자가 시스템을 사용할 권한이 있는지 확인\n- ( B ) : 실제 인증(패스워드 확인 등)을 수행\n- password : 패스워드 설정·변경 시 사용\n- ( C ) : 인증에 성공한 뒤 세션을 열고 닫는 작업 수행"}, {"id": "29-단2", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 2, "q": "윈도우 파일시스템", "a": "NTFS", "tags": ["시스템"], "full": "저널링, 대용량 파일 지원, 파일·폴더 단위 접근권한(ACL), 파일 암호화 같은 보안 기능을 제공하는 윈도우 파일 시스템의 이름은?"}, {"id": "29-단3", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 3, "q": "송신~수신 전 구간 암호화", "a": "종단간 암호화(E2EE)", "tags": ["네트워크"], "full": "메시지를 보내는 사람의 단말에서 받는 사람의 단말까지, 중간 서버를 포함한 전 구간에서 암호화를 풀지 않은 채로 전달하는 방식을 무엇이라 하는가?"}, {"id": "29-단4", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 4, "q": "내부문서 유출 탐지 솔루션", "a": "DLP", "tags": ["관제·IDS"], "full": "다음 기능을 가진 정보보호 솔루션의 명칭을 쓰시오.\n- PC 에이전트와 네트워크 센서로 USB 등 이동식 저장장치, 이메일, 메신저, 웹 업로드를 통한 내부 문서 반출을 탐지\n- HTTPS 같은 암호화 통신 구간에서도 중요 문서 이동을 탐지\n- 제품에 따라 파일 암호화·삭제 기능도 제공"}, {"id": "29-단5", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 5, "q": "strcpy 소스코드 취약점", "a": "(스택) 버퍼 오버플로우, strcpy()", "tags": ["시스템"], "full": "다음 C 코드를 보고 물음에 답하시오.\n1) 이 코드에 존재하는 취약점의 이름은?\n2) 취약점을 일으키는 함수의 이름은?\n```\nint main(int argc, char *argv[])\n{\n    char buffer[16];\n    if (argc > 1) {\n        strcpy(buffer, argv[1]);\n        printf(\"%s\\n\", buffer);\n    }\n    return 0;\n}\n```"}, {"id": "29-단6", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 6, "q": "패스워드 해시 저장 파일", "a": "/etc/shadow", "tags": ["시스템"], "full": "리눅스에서 계정별 패스워드 해시값과 패스워드 만료 정보를 저장하는 파일이다. 유출되면 레인보우 테이블 등으로 패스워드를 추측하는 공격에 악용될 수 있어 엄격히 보호해야 한다. 파일 경로의 (A)를 쓰시오.\n/etc/( A )"}, {"id": "29-단7", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 7, "q": "DNS 전송 프로토콜·캐시·유지기간", "a": "UDP(또는 TCP), Cache, TTL", "tags": ["네트워크"], "full": "DNS에 관한 설명이다. 빈칸에 알맞은 용어를 쓰시오.\n1) DNS는 53번 포트를 사용하며, 전송 계층 프로토콜로 ( A )를 사용한다.\n2) DNS 서버는 같은 질의를 상위 DNS에 반복해서 보내지 않도록 응답을 ( B )에 저장해 두며, 이 정보가 유지되는 시간을 ( C )라고 한다."}, {"id": "29-단8", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 8, "q": "Shellshock 로그로 생성한 b.php", "a": "웹쉘", "tags": ["웹보안", "시스템"], "full": "다음 웹 서버 access 로그에서 공격자가 웹 디렉터리에 만들려고 하는 b.php 파일은 무엇인가? (파일의 종류를 쓰시오)\n```\n\"GET /cgi-bin/websrc HTTP/1.1\" 301 26 \"-\" \"() { :;}; echo \\\" <? \\$cmd = \\$_REQUEST[\\\"cmd\\\"]; if(\\$cmd != \\\"\\\") print shell_exec(\\$cmd);?>\\\" > ../b.php & o\"\n```"}, {"id": "29-단9", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 9, "q": "위험분석 접근법", "a": "베이스라인, 상세 위험분석, 복합 접근법", "tags": ["위험관리"], "full": "위험분석 접근법에 대한 설명이다. 빈칸에 알맞은 명칭을 쓰시오.\n- ( A ) : 모든 시스템에 공통으로 적용할 기본 보호 수준을 정하고, 표준 체크리스트로 보호대책을 선택하는 방식\n- ( B ) : 정해진 모델에 따라 자산·위협·취약성 분석을 단계별로 수행하여 위험을 평가하는 방식\n- ( C ) : 고위험 영역은 상세 위험분석을, 나머지 영역은 베이스라인 접근법을 적용하는 방식"}, {"id": "29-단10", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 10, "q": "전기통신설비 이용 정보통신체제", "a": "정보통신망", "tags": ["개인정보·법규"], "full": "다음은 정보통신망법상 용어의 정의이다. (A)에 들어갈 용어는?\n\"( A )\"이란 전기통신사업법에 따른 전기통신설비를 이용하거나, 전기통신설비와 컴퓨터 및 그 이용기술을 활용하여 정보를 수집·가공·저장·검색·송신 또는 수신하는 정보통신체제를 말한다."}, {"id": "29-단11", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 11, "q": "디렉터리 인덱싱 대응 시 삭제할 지시자", "a": "Indexes", "tags": ["웹보안"], "full": "다음 Apache 설정에서 디렉터리 인덱싱(리스팅) 취약점을 없애려면 어떤 값을 삭제해야 하는가?\n```\n<Directory /var/www>\n    Options Indexes FollowSymLinks\n    AllowOverride None\n    Require all granted\n<\/Directory>\n```"}, {"id": "29-단12", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "단답형", "no": 12, "q": "acct/pacct 확인 명령", "a": "lastcomm", "tags": ["시스템"], "full": "리눅스에서 로그인한 사용자들이 실행한 명령어 기록이 남는 acct/pacct 파일의 내용을 확인하는 명령어는?"}, {"id": "29-서13", "round": 29, "meta": "2025.07.26, 합격률 15.2%", "type": "서술형", "no 1) (A)와 (B)에서 확인되는 취약점은 무엇인가?\n2) (A)의 대응 방안은?\n3) (B)의 대응 방안은?"}, {"id": "27-단1", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 1, "q": "접근통제 모델", "a": "DAC, MAC, RBAC", "tags": ["보안일반"], "full": "접근통제 모델에 관한 설명이다. 빈칸에 알맞은 모델을 쓰시오.\n- ( A ) : 사용자 또는 그룹의 신원을 근거로, 소유자가 접근 권한을 정하는 방식\n- ( B ) : 객체마다 비밀 등급(보안 레이블)을 부여하고, 허가 등급을 가진 주체만 접근하게 하는 방식\n- ( C ) : 사용자에게 역할(Role)을 부여하고, 역할에 따라 접근 권한을 주는 방식"}, {"id": "27-단2", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 2, "q": "MAC으로 IP 얻는 프로토콜", "a": "RARP", "tags": ["네트워크"], "full": "MAC 주소를 가지고 자신의 IP 주소를 알아내는 프로토콜로, 디스크가 없는 장치나 네트워크 부팅 장비에서 쓰이는 것은?"}, {"id": "27-단3", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 3, "q": "VLAN 구성 방식", "a": "포트, MAC, 네트워크 주소, 프로토콜 기반", "tags": ["네트워크"], "full": "VLAN 구성 방식에 관한 설명이다. 빈칸을 채우시오.\n- ( A ) 기반 VLAN : 스위치 포트 단위로 VLAN을 지정. 가장 일반적인 방식\n- ( B ) 기반 VLAN : 호스트의 MAC 주소를 VLAN에 등록. 모든 MAC을 관리해야 하는 부담이 있음\n- ( C ) 기반 VLAN : 네트워크 주소(서브넷)별로 VLAN 구성\n- ( D ) 기반 VLAN : 같은 통신 프로토콜을 쓰는 호스트끼리 VLAN 구성"}, {"id": "27-단4", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 4, "q": "전자금융거래법 정보보호 책임자", "a": "CISO", "tags": ["개인정보·법규"], "full": "전자금융거래법에서 다음 업무를 담당하도록 정한 사람의 직책은?\n1) 전자금융거래의 안전성 확보와 이용자 보호를 위한 전략·계획 수립\n2) 정보기술부문 보호\n3) 정보기술부문 보안에 필요한 인력 관리와 예산 편성\n4) 전자금융사고 예방과 조치"}, {"id": "27-단5", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 5, "q": "리눅스 로그", "a": "utmp, wtmp, lastlog", "tags": ["시스템"], "full": "리눅스 로그 파일에 관한 설명이다. 빈칸에 알맞은 파일명을 쓰시오.\n- ( A ) : 현재 로그인해 있는 사용자 정보\n- ( B ) : 로그인·로그아웃·재부팅 이력이 누적 기록됨\n- ( C ) : 계정별 마지막 로그인 성공 정보"}, {"id": "27-단6", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 6, "q": "닫힌 포트만 응답하는 스캔", "a": "FIN, XMAS, NULL", "tags": ["네트워크"], "full": "다음 스캔 기법 중 대상 포트가 닫혀 있을 때만 응답(RST)이 오는 것을 모두 고르시오.\n[보기] SYN scan, FIN scan, XMAS scan, NULL scan, Decoy scan"}, {"id": "27-단7", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 7, "q": "SW 개발보안 취약점", "a": "SQL Injection, XSS, OS 명령어 삽입", "tags": ["웹보안"], "full": "SW 개발보안 취약점에 관한 설명이다. 빈칸에 알맞은 취약점(공격) 이름을 쓰시오.\n- ( A ) : DB와 연동된 애플리케이션의 입력값을 조작해 의도하지 않은 쿼리를 실행시키는 공격\n- ( B ) : 게시판·메일 등에 넣은 악성 스크립트가 다른 사용자 브라우저에서 실행되어 쿠키 등을 빼가는 공격\n- ( C ) : 검증되지 않은 입력값이 운영체제 명령어의 일부로 실행되어 시스템 명령이 수행되는 공격"}, {"id": "27-단8", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 8, "q": "telnet 80 지원 메소드 확인", "a": "OPTIONS", "tags": ["웹보안", "시스템"], "full": "다음은 웹 서버에 접속해 특정 메소드를 보낸 결과이다. 빈칸에 들어갈 HTTP 메소드는?\n```\nroot@kali:~# telnet webserver.com 80\nConnected to webserver.com.\n(        ) * HTTP/1.0\n\nHTTP/1.1 200 OK\nServer: Microsoft-IIS/5.0\nAllow: GET, HEAD, POST, OPTIONS, TRACE\nContent-Length: 0\nConnection: close\n```"}, {"id": "27-단9", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 9, "q": "패치 종류", "a": "핫픽스, 업데이트", "tags": ["위험관리"], "full": "소프트웨어 패치 종류에 관한 설명이다. 빈칸을 채우시오.\n- ( A ) : 긴급히 고쳐야 하는 중대한 취약점을 위해 서비스팩과 별도로 배포되는 패치\n- ( B ) : 문제를 예방·해결하거나 기능·사용성을 개선하기 위해 제공되는 추가 소프트웨어"}, {"id": "27-단10", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 10, "q": "매니저-에이전트 관리 프로토콜", "a": "SNMP", "tags": ["네트워크"], "full": "매니저-에이전트 구조로 동작하며, 네트워크 장비의 상태를 모니터링하고 관리하는 데 쓰이는 TCP/IP 기반 프로토콜은?"}, {"id": "27-단11", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 11, "q": "일정 위험 받아들임", "a": "위험 수용", "tags": ["위험관리"], "full": "어떤 대책을 써도 위험을 0으로 만들 수는 없으므로, 일정 수준 이하의 위험은 그대로 받아들이고 사업을 진행하는 위험 처리 방식은?"}, {"id": "27-단12", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "단답형", "no": 12, "q": "브로드캐스트 도메인 축소 LAN", "a": "VLAN", "tags": ["네트워크"], "full": "네트워크를 논리적으로 나눠 보안을 강화하고, 브로드캐스트 도메인을 줄여 성능을 높이는 LAN 기술은?"}, {"id": "27-서13", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "서술형", "no": 13, "q": "복합 접근법 개념·장단점", "a": "고위험=상세, 나머지=베이스라인 / 장: 정확성·속도 균형 / 단: 기준·관리 복잡", "tags": ["위험관리"], "full": "위험분석 접근법 중 복합 접근법(Combined Approach)의 개념, 장점, 단점을 설명하시오."}, {"id": "27-서14", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "서술형", "no": 14, "q": "정보보호조치 지침 1.2.1·1.2.2", "a": "방침 수립(목표·범위·책임, 법 요구사항 문서화) / 실행계획(예산·일정, 경영층 승인, CISO 반기 점검)", "tags": ["개인정보·법규"], "full": "「정보보호조치에 관한 지침」(정보통신망법 제45조 근거)의 보호조치 항목 중 다음 두 항목이 요구하는 내용을 설명하시오.\n1) 1.2.1 정보보호 방침의 수립·이행\n2) 1.2.2 정보보호 실행계획의 수립·이행"}, {"id": "27-서15", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "서술형", "no": 15, "q": "-rwxr-x--x 의미", "a": "소유자 rwx, 그룹 r-x, 기타 --x", "tags": ["시스템"], "full": "유닉스 파일에 다음과 같은 권한이 설정되어 있다. 이 권한의 의미를 소유자·그룹·기타 사용자별로 자세히 설명하시오.\n-rwxr-x--x"}, {"id": "27-서16", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "서술형", "no": 16, "q": "미러사이트 (21회 동일)", "a": "Active-Active 실시간 / 장: RTO 즉시·RPO 0 / 단: 고비용·과부하 / RTO 최장: 콜드사이트", "tags": ["위험관리"], "full": "재해복구시스템 유형(미러·핫·웜·콜드 사이트)에 대해 답하시오.\n1) 미러 사이트의 정의\n2) 미러 사이트의 장점과 단점 각 2가지\n3) RTO(목표 복구 시간)가 가장 긴 방식과 그 이유"}, {"id": "27-실17", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "실무형", "no": 17, "q": "PreparedStatement 빈칸", "a": "?, prepareStatement, setString, executeQuery()", "tags": ["웹보안"], "full": "SQL Injection에 취약한 자바 코드를 PreparedStatement로 고친 것이다. (A)~(D)에 알맞은 코드를 쓰시오.\n```\n[취약한 코드]\nString gubun = request.getParameter(\"gubun\");\nString sql = \"SELECT * FROM board WHERE b_gubun = '\" + gubun + \"'\";\nConnection con = db.getConnection();\nStatement stmt = con.createStatement();\nResultSet rs = stmt.executeQuery(sql);\n\n[수정한 코드]\nString gubun = request.getParameter(\"gubun\");\nString sql = \"SELECT * FROM board WHERE b_gubun = ( A )\";\nConnection con = db.getConnection();\nPreparedStatement pstmt = con.( B )(sql);\npstmt.( C )(1, gubun);\nResultSet rs = pstmt.( D );\n```"}, {"id": "27-실18", "round": 27, "meta": "2024.11.23, 합격률 29.7%", "type": "실무형", "no": 18, "q": "NTP DDoS 대응 4가지", "a": "4.2.8 이상 업그레이드, disable monitor, UDP 123 접근 제한, 큰 응답 패킷 차단", "tags": ["네트워크"], "full": "NTP 서비스 취약점(monlist)을 이용한 DDoS(증폭) 공격의 대응 방안 4가지를 쓰시오."}, {"id": "26-단1", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 1, "q": "패스워드 최소 길이", "a": "/etc/login.defs, PASS_MIN_LEN 8", "tags": ["시스템"], "full": "리눅스에서 패스워드 최소 길이를 8자 이상으로 강제하려 한다. 설정 파일 이름(A)과 설정 항목(B), 값(C)을 쓰시오.\n```\n# cat /etc/( A )\n( B )   ( C )\n```"}, {"id": "26-단2", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 2, "q": "CSMA/CA 타임아웃 신호", "a": "RTS, CTS", "tags": ["네트워크"], "full": "무선랜은 충돌을 피하기 위해 CSMA/CA를 쓴다. 전송 시간(타임아웃) 정보를 담는 제어 신호 2개를 보기에서 고르시오.\n[보기] CTS, DATA, RST, SYN, ACK, RTS"}, {"id": "26-단3", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 3, "q": "DNS 질의 순서", "a": "Recursive(Cache) → Authoritative", "tags": ["네트워크"], "full": "도메인 이름의 IP를 찾을 때, 클라이언트는 먼저 가까이 있는 ( A ) DNS 서버에 질의하고, 거기에 정보가 없으면 해당 도메인을 직접 관리하는 ( B ) DNS 서버에 질의하여 답을 얻는다. 빈칸을 채우시오."}, {"id": "26-단4", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 4, "q": "헤더 변조로 백엔드 직접 요청", "a": "HTTP Request Smuggling", "tags": ["웹보안"], "full": "공격자가 Content-Length, Transfer-Encoding: chunked 같은 HTTP 헤더를 조작해 프런트엔드와 백엔드 서버가 요청 경계를 다르게 해석하게 만들고, 이를 이용해 정보 탈취·XSS·웹 캐시 포이즈닝을 하는 공격은?\n[보기] XSS, CSRF, SQL Injection, HTTP Request Smuggling"}, {"id": "26-단5", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 5, "q": "오판 유형", "a": "오탐(FP), 미탐(FN)", "tags": ["관제·IDS"], "full": "침입탐지시스템이 정상 행위를 공격으로 잘못 판단하는 것을 ( A ), 실제 공격을 정상으로 놓치는 것을 ( B )라고 한다. 빈칸을 채우시오."}, {"id": "26-단6", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 6, "q": "XML 삽입 대응 설계", "a": "공통 검증, 필터링, (안전한) API", "tags": ["웹보안"], "full": "XML 조회 기능에서 XML 삽입(XPath/XQuery Injection)을 막기 위한 설계 고려사항이다. 빈칸을 채우시오.\n(ㄱ) ( A ) 컴포넌트를 이용한 입력값 필터링 : XML 삽입에 쓰이는 문자열을 걸러내는 Validator 컴포넌트를 만들어 모든 XML 조회 기능에 일괄 적용\n(ㄴ) 개별 코드에서 입력값을 ( B )하도록 규칙 정의 : 각 컴포넌트에서 \", [, ], /, =, @ 같은 위험 문자를 제거하거나 치환\n(ㄷ) 안전한 ( C )를 쓰도록 규칙 정의 : 입력값이 쿼리 구조를 바꿀 수 없는 ( C )(예: Java XQuery API)를 사용"}, {"id": "26-단7", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 7, "q": "장기 지능형 표적 공격", "a": "APT", "tags": ["관제·IDS"], "full": "특정 조직을 노려 내부망에 침투한 뒤 오랫동안 들키지 않고 정보를 수집·유출하는 지능형 표적 공격은?"}, {"id": "26-단8", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 8, "q": "TCP 윈도우 0 공격", "a": "Slow Read Attack", "tags": ["네트워크", "시스템"], "full": "공격자가 TCP 윈도우 크기를 0(또는 아주 작게)으로 알려 서버가 응답을 보내지 못하고 연결을 계속 붙잡고 있게 만드는 DoS 공격은?"}, {"id": "26-단9", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 9, "q": "XSS 유형", "a": "Reflected, Stored, DOM based", "tags": ["웹보안"], "full": "XSS 유형에 대한 설명이다. 빈칸을 채우시오.\n(1) ( A ) : 입력값이 서버에 저장되지 않고 응답에 바로 반영됨. 사용자가 공격자가 보낸 링크를 클릭할 때 발생\n(2) ( B ) : 공격자의 입력값이 서버(DB)에 저장되었다가 다른 사용자가 볼 때 실행됨\n(3) ( C ) : 클라이언트 스크립트가 DOM을 처리하는 과정을 공격자가 조작할 수 있을 때 발생"}, {"id": "26-단10", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 10, "q": "IDS 유형", "a": "HIDS, NIDS", "tags": ["관제·IDS"], "full": "호스트의 내부 상태나 로그를 분석해 침입을 탐지하는 ( A )와, 네트워크로 오가는 패킷을 분석해 침입을 탐지하는 ( B )가 있다. 빈칸을 채우시오."}, {"id": "26-단11", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 11, "q": "위험 구성 요소", "a": "자산, 위협, 취약성", "tags": ["위험관리"], "full": "위험의 구성 요소에 관한 설명이다. 빈칸을 채우시오.\n- ( A ) : 조직에 가치가 있어 보호해야 할 대상\n- ( B ) : 자산에 손실을 줄 수 있는 원치 않는 사건의 잠재적 원인 또는 행위자\n- ( C ) : 위협이 이용할 수 있는 자산의 약점"}, {"id": "26-단12", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "단답형", "no": 12, "q": "위험관리 단계", "a": "위험관리 / 위험분석 → 위험평가 → 위험처리", "tags": ["위험관리"], "full": "( A )는 자산에 대한 위험을 감당 가능한 수준으로 유지하기 위해 위험을 분석하고 비용 대비 효과적인 대책을 마련하는 전체 과정이다. ( A )는 ( B ) → 위험 평가 → ( C ) 단계로 진행된다.\n- ( B ) : 식별된 위험이 조직의 목표와 운영에 미칠 가능성과 영향을 분석하는 단계\n- ( C ) : 위험을 완화·전가·수용·회피 중 어떻게 처리할지 정하는 단계"}, {"id": "26-서13", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "서술형", "no": 13, "q": "UAC 팝업 [예] 비활성", "a": "관리자 권한 실행 의도 / 관리자 계정 비활성·삭제, 시스템 파일 손상", "tags": ["시스템"], "full": "사용자가 cmd.exe(윈도우 명령 처리기)를 실행하자 다음과 같은 사용자 계정 컨트롤(UAC) 창이 떴다. 이 창에서 [예] 버튼은 비활성화되어 있고 [아니요] 버튼만 누를 수 있다.\n```\n다음 프로그램이 이 컴퓨터를 변경할 수 있도록 허용하시겠습니까?\n- 프로그램 이름 : Windows 명령 처리기\n- 확인된 게시자 : Microsoft Windows\n- 파일 원본 : 이 컴퓨터의 하드 드라이브\n계속하려면 관리자 암호를 입력하고 [예]를 클릭하십시오.\n```\n1) 사용자가 명령 처리기를 이렇게 실행한 의도는 무엇인가?\n2) [예] 버튼이 비활성화된 이유는 무엇인가?"}, {"id": "26-서14", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "서술형", "no": 14, "q": "개인정보 영향평가 고려사항 5", "a": "개인정보 수, 제3자 제공 여부, 권리 침해 가능성, 민감·고유식별정보 처리 여부, 보유기간", "tags": ["개인정보·법규"], "full": "개인정보 처리가 따르는 사업을 할 때 개인정보에 미칠 영향을 미리 분석하고 개선하기 위해 개인정보 영향평가를 수행한다. 영향평가 시 고려해야 할 사항 5가지를 쓰시오."}, {"id": "26-서15", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "서술형", "no": 15, "q": "Promiscuous 모드 (19회 동일)", "a": "모든 패킷 수신 / 스니핑 / 암호화 통신, 스위치, -promisc 해제, 탐지 도구", "tags": ["네트워크"], "full": "시스템 로그를 점검하다 다음 로그를 발견했다. 물음에 답하시오.\n```\ndevice eth0 entered promiscuous mode\n```\n1) Promiscuous 모드의 의미는?\n2) 이 모드에서 가능한 공격은?\n3) 대응 방법은?"}, {"id": "26-서16", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "서술형", "no": 16, "q": "XSS 정의·기법 2가지", "a": "Reflected, Stored, DOM 중 2개 설명", "tags": ["웹보안"], "full": "XSS(Cross Site Scripting) 공격의 정의를 쓰고, 공격 기법(유형) 2가지를 설명하시오."}, {"id": "26-실17", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "실무형", "no": 17, "q": "DB 권한 관리", "a": "금지 권한: CREATE/DROP USER, DROP ANY TABLE 등 / IP 제한, 시스템 테이블 접근 제한, PUBLIC Role 금지, REMOTE_OS_* FALSE", "tags": ["시스템"], "full": "DB 권한 관리가 미흡하면 비인가자가 DB에 접근해 정보를 유출·훼손할 수 있다.\n1) DBA가 일반 사용자나 원격 사용자에게 주면 안 되는 권한 3가지를 쓰시오.\n2) DB 접근 권한을 최소화하는 방법 4가지를 쓰시오."}, {"id": "26-실18", "round": 26, "meta": "2024.08.10, 합격률 24.6%", "type": "실무형", "no": 18, "q": "하트블리드 조치", "a": "OpenSSL 1.0.1g 이상, Heartbeat 비활성 재컴파일 / 인증서 재발급, 사용자 비밀번호 변경 안내", "tags": ["웹보안", "네트워크"], "full": "다음 점검 결과를 보고 물음에 답하시오.\n```\n# openssl version -a\nOpenSSL 1.0.1 14 May 2012\n# openssl s_client -connect domain.com:8443 -tlsextdebug -debug -state | grep -i heartbeat\nSSL_connect:SSLv3/TLS write client hello\nSSL_connect:SSLv3/TLS read server hello\nTLS server extension \"heartbeat\" (id=15), len=1\n```\n1) 이 취약점의 이름은?\n2) 시스템 측면의 조치 방법은?\n3) 서비스(운영) 측면의 조치 방법은?"}, {"id": "25-단1", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 1, "q": "윈도우 그룹", "a": "Power Users, Backup Operators, Users", "tags": ["시스템"], "full": "윈도우 기본 계정 그룹에 관한 설명이다. 빈칸에 알맞은 그룹명을 쓰시오.\n- Administrators : 컴퓨터(도메인)에 대한 모든 권한\n- ( A ) : 일반 사용자보다 권한이 많지만 Administrators보다는 제한됨\n- ( B ) : 백업을 위해 모든 파일과 디렉터리에 접근 가능\n- ( C ) : 일반적인 사용자들이 속하는 그룹\n- Guests : 임시로 시스템을 쓰는 사용자용, 권한이 매우 제한됨"}, {"id": "25-단2", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 2, "q": "전자파 방사 도청 방지", "a": "TEMPEST", "tags": ["네트워크"], "full": "전자기기에서 새어 나오는 전자파(전자기 방사)를 통해 정보가 도청·유출되는 것을 막기 위한 표준과 기술을 무엇이라 하는가?"}, {"id": "25-단3", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 3, "q": "IPSec 기능 3가지", "a": "접근제어, 비연결형 무결성, 근원지 인증, 재전송 방지, 기밀성 등", "tags": ["네트워크"], "full": "IPSec이 제공하는 보안 서비스(기능) 3가지를 쓰시오."}, {"id": "25-단4", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 4, "q": "활성 세션 가로채기", "a": "세션 하이재킹", "tags": ["네트워크"], "full": "이미 인증되어 활성화된 사용자-서버 간 세션을 가로채 사용자인 척 서버와 통신하는 공격은?"}, {"id": "25-단5", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 5, "q": "보안통제 유형", "a": "예방 통제, 물리적 접근통제, 논리적 접근통제", "tags": ["위험관리", "보안일반"], "full": "정보보호대책(통제)의 분류에 관한 설명이다. 빈칸을 채우시오.\n( A )는 발생할 수 있는 문제를 미리 찾아 사전에 막는 능동적 통제로, 다음 두 가지로 나눌 수 있다.\n- ( B ) : 관계자 외의 사람이 시설·설비에 들어오지 못하게 하는 통제\n- ( C ) : 승인받지 않은 사람이 정보통신망을 통해 자산에 접근하지 못하게 하는 통제"}, {"id": "25-단6", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 6, "q": "sendmail access", "a": "RELAY, DISCARD", "tags": ["메일보안"], "full": "sendmail의 /etc/mail/access 파일로 다음 요구사항을 설정하려 한다. 빈칸에 알맞은 값을 쓰시오.\n- kca.or.kr 도메인 메일은 릴레이를 허용한다.\n- spam.com 도메인 메일은 (오류 회신 없이) 폐기한다.\n```\nkca.or.kr   ( A )\nspam.com    ( B )\n```"}, {"id": "25-단7", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 7, "q": "Burp·ZAP 류 도구", "a": "웹 프록시", "tags": ["웹보안"], "full": "다음 특징을 가진 도구를 무엇이라 하는가?\n- 브라우저와 웹 서버가 주고받는 HTTP/HTTPS 요청·응답을 중간에서 가로채 확인하고 수정할 수 있다.\n- Paros, Burp Suite, ZAP이 대표적이며, 웹 취약점 점검과 공격에 모두 쓰인다."}, {"id": "25-단8", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 8, "q": "/26 서브넷 마스크 2진수", "a": "11111111.11111111.11111111.11000000", "tags": ["네트워크"], "full": "IP 주소가 200.100.50.25(C 클래스)이고 서브넷 마스크가 255.255.255.192일 때, 서브넷 마스크를 2진수로 쓰시오."}, {"id": "25-단9", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 9, "q": "무작위 입력 테스트", "a": "퍼징(Fuzzing)", "tags": ["웹보안"], "full": "프로그램에 비정상적이거나 무작위인 데이터를 대량으로 넣어 오류와 취약점을 찾는 소프트웨어 테스트 기법은?"}, {"id": "25-단10", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 10, "q": "SSRF 대응", "a": "화이트리스트, 블랙리스트", "tags": ["웹보안"], "full": "SSRF(Server-Side Request Forgery) 대응 방법이다. 빈칸을 채우시오.\n- 사용자 입력으로 요청을 만들 때는 허용한 도메인·IP만 통과시키는 ( A ) 방식으로 필터링한다.\n- 입력값을 특정할 수 없어 임의 값을 허용해야 한다면 위험한 값을 막는 ( B ) 방식으로 필터링한다."}, {"id": "25-단11", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 11, "q": "위험처리", "a": "수용, 회피, 전가", "tags": ["위험관리"], "full": "위험평가 결과에 따른 위험 처리 방안이다. 빈칸을 채우시오.\n- 위험 감소 : 보호대책을 적용해 자산·위협·취약점 중 하나의 수준을 낮춤\n- ( A ) : 현재 위험을 받아들이고 예상 손실을 감수\n- ( B ) : 위험이 있는 업무나 사업 자체를 하지 않음\n- ( C ) : 보험·외주 등을 통해 손실 부담을 제3자에게 넘김"}, {"id": "25-단12", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "단답형", "no": 12, "q": "2015 가트너 지능형 관제", "a": "SOAR (SIEM 논란)", "tags": ["관제·IDS"], "full": "다음 설명에 해당하는 보안 솔루션은?\n- 2015년 가트너가 처음 제시함\n- 여러 보안 솔루션을 연동(오케스트레이션)하고, 플레이북 기반으로 대응을 자동화하는 차세대 보안관제 솔루션"}, {"id": "25-서13", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "서술형", "no": 13, "q": "SW 보안약점 진단 분석단계 산출물", "a": "요구사항 정의서, 요구사항 추적표, 유스케이스 다이어그램, 유스케이스 명세서", "tags": ["웹보안"], "full": "SW 보안약점 진단원이 CBD(컴포넌트 기반 개발) 방법론의 분석 단계를 진단할 때 검토해야 할 산출물 4가지와 각각의 내용을 간단히 설명하시오."}, {"id": "25-서14", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "서술형", "no": 14, "q": "Ping 이용 스니핑 탐지", "a": "존재하지 않는 MAC으로 위조한 ICMP Echo Request → 응답 오면 promiscuous", "tags": ["네트워크"], "full": "스니핑 탐지 방법(Ping, ARP, DNS, Decoy) 중 Ping(ICMP)을 이용해 스니핑 중인 호스트를 찾는 방법을 설명하시오."}, {"id": "25-서15", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "서술형", "no": 15, "q": "기밀성 등급 M/L 설명", "a": "M: 허가된 담당자만 / L: 내부 직원·공개", "tags": ["위험관리"], "full": "정보자산 중요도를 기밀성 등급으로 나눌 때 H(상) 등급은 \"매우 민감한 정보로, 업무상 꼭 필요한 책임자만 제한적으로 접근 가능\"으로 정의되어 있다. M(중) 등급(A)과 L(하) 등급(B)의 설명을 쓰시오."}, {"id": "25-서16", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "서술형", "no": 16, "q": "IDS 공격 탐지 시 행위 4가지", "a": "경보, 로그 기록, 세션 차단, 타 시스템 연동(+정책 업데이트)", "tags": ["네트워크", "시스템", "관제·IDS"], "full": "침입탐지시스템(IDS)이 공격을 탐지했을 때 할 수 있는 대응 행위 4가지를 쓰시오."}, {"id": "25-실17", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "실무형", "no": 17, "q": "ARP 캐시 테이블", "a": "arp -a / ARP Redirect(GW MAC 변조) / arp -s 192.168.100.1 00-0a-00-62-c6-09", "tags": ["네트워크"], "full": "인터넷이 갑자기 느려져 PC의 ARP 캐시 테이블을 조회했더니 다음과 같았다. 물음에 답하시오.\n```\n인터넷 주소         물리적 주소           유형\n192.168.100.1      01-00-5e-00-00-02    동적\n192.168.100.5      01-00-5e-00-00-02    동적\n192.168.100.20     b0-e4-5c-7c-37-6e    동적\n192.168.100.21     00-07-89-72-3d-04    동적\n192.168.100.22     01-00-5e-7f-ff-fa    동적\n```\n1) 위 목록을 출력하는 명령어는?\n2) 어떤 공격이 일어났다고 판단할 수 있는가? (192.168.100.1은 게이트웨이)\n3) 그렇게 판단한 이유는?\n4) 192.168.100.1의 실제 MAC 주소가 00-0a-00-62-c6-09일 때 대응을 위해 입력할 명령어는?"}, {"id": "25-실18", "round": 25, "meta": "2024.04.27, 합격률 11.3%", "type": "실무형", "no": 18, "q": "PE 악성코드 분석 3방식", "a": "자동(PEiD·YARA·Cuckoo), 반자동(샌드박스+디스어셈블러), 수동(정적 IDA·Ghidra / 동적 x64dbg)", "tags": ["시스템", "관제·IDS"], "full": "악성코드 작성자는 윈도우 PE 파일을 난독화하거나 PE 헤더·섹션을 변형해 분석을 어렵게 만든다. 이런 악성 PE 파일을 분석하는 다음 세 가지 방법을 설명하시오.\n1) 자동화 분석\n2) 반자동화 분석\n3) 수동 분석"}, {"id": "24-단1", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 1, "q": "영향평가 위험도 산정 공식", "a": "침해요인 발생 가능성, 법적 준거성, 2", "tags": ["위험관리", "개인정보·법규"], "full": "「개인정보 영향평가 수행 안내서」의 위험도 산정 공식이다. 빈칸을 채우시오.\n위험도 = 자산가치(영향도) + ( ( A ) × ( B ) ) × ( C )"}, {"id": "24-단2", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 2, "q": "DB 암호화 방식", "a": "API, Plug-in, TDE", "tags": ["시스템"], "full": "DB 암호화 방식에 대한 설명이다. 빈칸에 알맞은 방식명을 쓰시오.\n- ( A ) : 암·복호화 모듈을 라이브러리 형태로 애플리케이션 서버에 두고, 응용 프로그램이 직접 호출\n- ( B ) : 암·복호화 모듈을 DB 서버에 설치하고, DBMS가 플러그인 형태로 호출\n- ( C ) : DBMS에 내장된 암호화 기능을 이용 (응용 프로그램 수정 불필요)"}, {"id": "24-단3", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 3, "q": "LAN 스위칭", "a": "Cut-through, Fragment-free, Store-and-forward", "tags": ["네트워크"], "full": "LAN 스위칭 방식에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 프레임의 목적지 주소(헤더)만 보고 바로 전달\n- ( B ) : 프레임 앞부분 64바이트만 확인해 오류를 걸러낸 뒤 전달\n- ( C ) : 프레임 전체를 받아 오류를 검사한 뒤 전달"}, {"id": "24-단4", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 4, "q": "EAP + AES-CCMP", "a": "WPA2", "tags": ["네트워크"], "full": "EAP로 사용자 인증을 하고, AES-CCMP 방식으로 암호화하는 무선랜 보안 표준은?"}, {"id": "24-단5", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 5, "q": "VLAN 할당", "a": "정적(포트), 동적(MAC)", "tags": ["네트워크"], "full": "VLAN 할당 방식에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 관리자가 스위치에서 포트별로 직접 VLAN을 지정\n- ( B ) : MAC 주소 등을 근거로 VLAN이 자동 지정"}, {"id": "24-단6", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 6, "q": "로봇 배제 파일", "a": "robots.txt", "tags": ["웹보안"], "full": "웹사이트 루트 디렉터리에 두는 일반 텍스트 파일로, 로봇 배제 표준에 따라 검색 로봇이 수집해도 되는 페이지와 안 되는 페이지를 알려 주는 파일 이름은?"}, {"id": "24-단7", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 7, "q": "ISO 31000 위험평가", "a": "위험식별, 위험분석, 위험평가", "tags": ["위험관리"], "full": "ISO 31000의 위험평가(Risk Assessment) 절차이다. 빈칸에 알맞은 단계명을 쓰시오.\n- ( A ) : 내·외부 요인을 고려해 잠재된 위험을 찾아냄\n- ( B ) : 찾은 위험이 목표·운영에 미칠 가능성과 영향을 분석\n- ( C ) : 위험 성향·수용 능력을 고려해 허용 수준(DoA)과 비교하고, 위험 처리가 필요한지 결정"}, {"id": "24-단8", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 8, "q": "문서 유출 탐지", "a": "DLP", "tags": ["관제·IDS"], "full": "다음 기능을 하는 정보보호 솔루션의 이름은?\n- PC 에이전트와 네트워크 센서로 이동식 저장장치·이메일·메신저·웹 업로드를 통한 내부 문서 반출을 탐지\n- 암호화(HTTPS) 통신에서도 중요 문서 유출 탐지\n- 일부 제품은 파일 암호화·삭제 기능도 제공"}, {"id": "24-단9", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 9, "q": "숨겨진 프로세스 확인 경로", "a": "/proc", "tags": ["시스템"], "full": "유닉스에서 현재 실행 중인 프로세스 정보가 담겨 있어, 숨겨진 프로세스를 찾을 때 확인하는 가상 파일시스템 경로는 /( A )이다. (A)는?"}, {"id": "24-단10", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 10, "q": "아파치 로그 해석", "a": "GET 파라미터, 200, Referer", "tags": ["웹보안", "네트워크", "시스템"], "full": "다음 Apache access 로그를 보고 물음에 답하시오.\n```\n200.3.1.4 - - [30/May/2023:01:20:01 +09:00] \"GET /bulletin/read.php?no=101&item=book HTTP/1.1\" 200 3549 \"http://test.co.kr/main.php\" \"Mozilla/5.0 (compatible; MSIE 10.0; Windows NT 6.1; Trident/6.0)\"\n```\n1) no=101&item=book 의 의미는?\n2) HTTP 상태 코드와 그 의미는?\n3) \"http://test.co.kr/main.php\" 의 의미는?"}, {"id": "24-단11", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 11, "q": "가명처리 올림/내림", "a": "랜덤 라운딩", "tags": ["개인정보·법규"], "full": "개인정보 가명처리 기법 중, 수치 데이터를 임의의 자릿수나 기준값으로 올림·내림하는 기법의 이름은?"}, {"id": "24-단12", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "단답형", "no": 12, "q": "JNDI Lookup 원격 실행", "a": "Log4j", "tags": ["웹보안"], "full": "아파치 재단의 자바 기반 오픈소스 로깅 라이브러리로, 2021년 말 JNDI Lookup 기능에서 입력값 검증 없이 원격 코드가 실행되는 심각한 취약점이 발견된 프로그램의 이름은?"}, {"id": "24-서13", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "서술형", "no": 13, "q": "chmod -s / find -perm -4000 -2000", "a": "특수비트 제거·검색 / root 권한 실행 악용 방지", "tags": ["시스템"], "full": "다음 두 명령의 의미를 설명하고, 이런 조치가 왜 필요한지 쓰시오.\n```\n1) chmod -s {파일명}\n2) find / -user root -type f \\( -perm -4000 -o -perm -2000 \\) | xargs ls -al\n```"}, {"id": "24-서14", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "서술형", "no": 14, "q": "hosts.equiv / .rhosts", "a": "소유자 root(또는 해당 계정), 권한 600, \"+\" 제거", "tags": ["시스템"], "full": "rsh, rlogin, rexec 같은 r-명령어는 패스워드 없이 원격 접속을 허용할 수 있어 쓰지 않는 것이 좋다. 부득이하게 써야 한다면 /etc/hosts.equiv와 $HOME/.rhosts 파일의 소유자, 권한, 파일 내용을 각각 어떻게 설정해야 안전한지 설명하시오."}, {"id": "24-서15", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "서술형", "no": 15, "q": "iptables 체인·룰", "a": "INPUT/FORWARD/OUTPUT / NEW인데 SYN 아닌 패킷 로그", "tags": ["네트워크", "시스템"], "full": "iptables에 대해 답하시오.\n1) 기본 체인 3가지(INPUT, FORWARD, OUTPUT)를 설명하시오.\n2) 다음 룰의 의미를 설명하시오.\n```\niptables -A INPUT -p tcp ! --syn -m state --state NEW -j LOG --log-prefix \"[Faked NEW request]\"\n```"}, {"id": "24-서16", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "서술형", "no": 16, "q": "SNMP 보안 4가지", "a": "커뮤니티 스트링 변경, v3, ACL, RO 모드", "tags": ["네트워크"], "full": "SNMP 서비스를 사용할 때 적용해야 하는 보안 설정 4가지를 설명하시오."}, {"id": "24-실17", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "실무형", "no": 17, "q": "4개 OS 패스워드 길이", "a": "Solaris /etc/default/passwd PASSLENGTH, Linux login.defs PASS_MIN_LEN, AIX /etc/security/user minlen, HP-UX /etc/default/security MIN_PASSWORD_LENGTH", "tags": ["위험관리", "네트워크", "시스템"], "full": "Solaris, Linux, AIX, HP-UX 서버에서 패스워드 최소 길이를 8자 이상으로 설정하는 방법(설정 파일과 설정값)을 OS별로 쓰시오."}, {"id": "24-실18", "round": 24, "meta": "2023.11.25, 합격률 8%", "type": "실무형", "no": 18, "q": "xinetd 설정", "a": "no_access, only_from, instances, 09:00-18:00", "tags": ["시스템"], "full": "다음 xinetd의 telnet 설정에서 (1)~(4)에 알맞은 값을 쓰시오.\n```\n# cat /etc/xinetd.d/telnet\nservice telnet\n{\n    flags          = REUSE\n    socket_type    = stream\n    wait           = no\n    user           = root\n    server         = /usr/sbin/in.telnetd\n    log_on_failure += USERID\n    disable        = no\n    ( 1 )  = 10.0.0.0/8        # 이 대역은 접속 차단\n    ( 2 )  = 192.168.10.0/24   # 이 대역만 접속 허용\n    ( 3 )  = 3                 # 동시 접속 최대 3세션\n    access_time = ( 4 )        # 09시~18시에만 허용\n}\n```"}, {"id": "23-단1", "round": 23, "meta": "2023.07.29, 합격률 약 2~3%, 역대 최난도", "type": "단답형", "no": 1, "q": "IIS·DHCP 로그 경로", "a": "HTTPERR, DHCP (난이도 조절용)", "tags": ["웹보안", "시스템"], "full": "윈도우 서버의 로그 저장 경로이다. 빈칸을 채우시오.\n```\n[IIS 로그]\nC:\\inetpub\\logs\\LogFiles\\W3SVC1\nC:\\inetpub\\logs\\LogFiles\\MSFTPSVC1\nC:\\Windows\\System32\\LogFiles\\( A )      ← HTTP API 오류 로그\n[DHCP 로그]\nC:\\Windows\\System32\\LogFiles\\( B )\n```"}, {"id": "23-단2", "round": 23, "meta": "2023.07.29, 합격률 약 2~3%, 역대 최난도", "type": "단답형", "no": 2, "q": "x64 printf 인자 레지스터", "a": "RDI, RSI, RDX 산하는 데 필요한 정보\n4) 연간 손실(ALE)을 완전히 없애는 데 든 비용이 X일 때, ROI(%)를 구하는 식"}, {"id": "21-실16", "round": 21, "meta": "2022.11.26, 합격률 13.8%", "type": "실무형", "no": 16, "q": "DNS 존 파일", "a": "master/slave, allow-update, masters, A 레코드", "tags": ["네트워크"], "full": "마스터/슬레이브 DNS 존 설정이다. (A)~(F)에 알맞은 값을 쓰시오.\n- 마스터 : ns1.korea.co.kr (192.168.1.1)\n- 슬레이브 : ns2.korea.co.kr (192.168.1.2)\n```\n[마스터 /etc/named.conf]\nzone \"korea.co.kr\" IN {\n    type ( A );\n    file \"korea.co.kr.db\";\n    allow-update { ( B ) };\n};\n[마스터 /var/named/korea.co.kr.db]\n$TTL 1000\n@ IN SOA ns1.korea.co.kr. master.korea.co.kr. (\n        2022113001 ; serial\n        21600      ; refresh\n        3600       ; retry\n        604800     ; expire\n        3600 )     ; minimum\n    IN NS ns1.korea.co.kr.\n    IN NS ns2.korea.co.kr.\nns1 IN A ( C )\nns2 IN A ( D )\n[슬레이브 /etc/named.conf]\nzone \"korea.co.kr\" IN {\n    type ( E );\n    file \"slave/korea.co.kr.db\";\n    masters { ( F ) };\n};\n```"}, {"id": "20-단1", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 1, "q": "지원 메소드 확인", "a": "OPTIONS", "tags": ["웹보안"], "full": "다음은 웹 서버가 지원하는 메소드를 확인한 결과이다. 빈칸에 들어갈 HTTP 메소드는?\n```\nroot@kali:~# telnet webserver.com 80\n(        ) * HTTP/1.0\n\nHTTP/1.1 200 OK\nServer: Microsoft-IIS/5.0\nAllow: GET, HEAD, POST, OPTIONS, TRACE\nContent-Length: 0\n```"}, {"id": "20-단2", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 2, "q": "위험분석 기법", "a": "델파이, 시나리오, 순위결정법", "tags": ["위험관리"], "full": "위험분석 기법에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 전문가 집단의 토론으로 위험을 분석·평가\n- ( B ) : 사건이 기대대로 일어나지 않는다는 전제에서 특정 조건의 발생 가능한 결과를 추정\n- ( C ) : 비교 우위 순위표에 따라 위험 항목들의 순위를 정함"}, {"id": "20-단3", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 3, "q": "위험분석 접근법", "a": "베이스라인, 상세, 복합", "tags": ["위험관리"], "full": "위험분석 접근법에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 모든 시스템에 기본 보호 수준을 정하고 표준 체크리스트로 대책 선택\n- ( B ) : 정해진 모델로 자산·위협·취약성 분석을 단계별로 수행\n- ( C ) : 고위험 영역은 상세 분석, 나머지는 베이스라인 적용"}, {"id": "20-단4", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 4, "q": "접근통제", "a": "DAC, MAC, RBAC", "tags": ["보안일반"], "full": "접근통제 정책에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 사용자·그룹 신원에 근거해 소유자가 권한을 정함\n- ( B ) : 객체의 비밀 등급과 주체의 허가 등급을 비교해 접근 통제\n- ( C ) : 역할(Role)에 따라 권한 부여"}, {"id": "20-단5", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 5, "q": "IDS 오판", "a": "오탐, 미탐", "tags": ["관제·IDS"], "full": "IDS 판정 오류에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : 정상 행위를 공격으로 잘못 탐지\n- ( B ) : 실제 공격을 탐지하지 못함"}, {"id": "20-단6", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 6, "q": "IPSec 서비스 3가지", "a": "기밀성, 근원지 인증, 접근제어, 무결성, 재전송 방지 등", "tags": ["네트워크"], "full": "IPSec이 제공하는 보안 서비스 중 3가지를 쓰시오."}, {"id": "20-단7", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 7, "q": "사토시 나카모토", "a": "비트코인, 블록체인, 채굴", "tags": ["보안일반"], "full": "빈칸을 채우시오.\n( A )는 사토시 나카모토가 만든 가상화폐로, 거래 내역을 ( B )에 기록한다. 해시 연산으로 거래(작업)를 증명하고 그 대가로 ( A )를 얻는 행위를 ( C )이라 한다."}, {"id": "20-단8", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 8, "q": "디렉터리 인덱싱", "a": "Indexes 삭제", "tags": ["웹보안"], "full": "다음 Apache 설정에서 디렉터리 인덱싱 취약점을 없애려면 무엇을 삭제해야 하는가?\n```\n<Directory /var/www>\n    Options Indexes FollowSymLinks\n    AllowOverride None\n    Require all granted\n<\/Directory>\n```"}, {"id": "20-단9", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 9, "q": "CNAME 미삭제 악용", "a": "서브도메인 하이재킹(테이크오버)", "tags": ["네트워크"], "full": "클라우드 서비스용으로 서브도메인에 CNAME을 설정해 두었다가 서비스를 해지한 뒤에도 CNAME을 지우지 않아, 공격자가 그 서브도메인을 가로채 피싱 사이트로 쓰는 공격은?"}, {"id": "20-단10", "round": 20, "meta": "2022.08.13", "type": "단답형", "no": 10, "q": "ISMS-P 물리 보호대책", "a": "보호구역, 출입통제, 반출입 통제 등", "tags": ["개인정보·법규"], "full": "ISMS-P 인증 기준 중 '물리 보안' 영역의 통제 항목을 3가지 쓰시오."}, {"id": "20-서11", "round": 20, "meta": "2022.08.13", "type": "서술형", "no": 11, "q": "개인정보 수집 가능 경우 4가지", "a": "동의, 법률 규정, 공공기관 소관업무, 계약 이행, 급박한 이익, 정당한 이익", "tags": ["개인정보·법규"], "full": "개인정보 보호법상 개인정보를 수집·이용할 수 있는 경우 4가지를 쓰시오."}, {"id": "20-서12", "round": 20, "meta": "2022.08.13", "type": "서술형", "no": 12, "q": "스위칭 허브 기능·원리", "a": "Learning, Forwarding, Filtering, Flooding, Aging", "tags": ["네트워크"], "full": "스위칭 허브(L2 스위치)의 기능과 동작 원리를 설명하시오."}, {"id": "20-서13", "round": 20, "meta": "2022.08.13", "type": "서술형", "no": 13, "q": "Snort anonymous FTP 탐지", "a": "대소문자 혼합으로 우회 시도 → nocase로 탐지, 위험·대응 설명", "tags": ["위험관리", "관제·IDS"], "full": "다음 Snort 룰에 탐지된 패킷을 보고 어떤 공격이 시도되었는지 설명하시오.\n```\n[Snort Rule]\nalert tcp any any -> any 21 (content:\"anonymous\"; nocase; msg:\"Anonymous FTP attempt\"; sid:1000012;)\n\n[탐지 패킷]\nTCP TTL:64 TOS:0x10 ID:5450 IpLen:20 DgmLen:68 DF\n***AP*** Seq: 0xE95B8593 Ack: 0x7D3F3893 Win: 0x1D TcpLen: 32\n55 53 45 52 20 41 6E 4F 6E 59 6D 4F 75 53 0D 0A   USER AnOnYmOuS..\n```"}, {"id": "20-실14", "round": 20, "meta": "2022.08.13", "type": "실무형", "no": 14, "q": "스팸 릴레이 설정", "a": "sendmail.cf, REJECT, makemap, access.db", "tags": ["메일보안"], "full": "sendmail 스팸 릴레이 제한 설정이다. (1)~(4)에 알맞은 값을 쓰시오.\n```\n# cat /etc/mail/( 1 ) | grep \"R$\\*\" | grep \"Relaying denied\"\nR$*     $#error $@ 5.7.1 $: \"550 Relaying denied\"\n# cat /etc/mail/access\nlocalhost.localdomain   RELAY\nlocalhost               RELAY\n127.0.0.1               RELAY\nspam.com                ( 2 )        # 릴레이 허용 안 함\n# ( 3 ) hash /etc/mail/( 4 ) < /etc/mail/access\n```"}, {"id": "20-실15", "round": 20, "meta": "2022.08.13", "type": "실무형", "no": 15, "q": "Smurf 라우터 설정", "a": "access-list 100 permit udp …, interface, ip directed-broadcast 100", "tags": ["네트워크"], "full": "Smurf 공격을 막기 위해, 신뢰하는 대역(192.168.1.0/24)에서 시작한 UDP 패킷에 대해서만 IP directed broadcast를 허용하도록 라우터를 설정하려 한다. (A)~(C)에 알맞은 명령을 쓰시오.\n```\nRouter(config)# ( A )\nRouter(config)# ( B )\nRouter(config-if)# ( C )\n```"}, {"id": "20-실16", "round": 20, "meta": "2022.08.13", "type": "실무형", "no": 16, "q": "위험 대응 기법", "a": "수용 의미, 보호대책 효과 = 감소 ALE − 운영비, 회피=축소·포기, 전가=보험·외주", "tags": ["위험관리"], "full": "위험 대응(처리) 기법에 대해 답하시오.\n1) 위험 수용의 의미는?\n2) 위험 감소를 위한 대책을 고를 때, 대책의 가치를 정량적으로 평가하는 방법은?\n3) 위험 회피 시 위험이 있는 업무나 사업은 어떻게 하는가?\n4) 위험 전가 방법 2가지는?"}, {"id": "19-단1", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 1, "q": "위험 3요소", "a": "자산, 위협, 취약점", "tags": ["위험관리"], "full": "위험관리 구성 요소에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : ( B )로부터 보호해야 할 대상\n- ( B ) : ( A )에 손실을 일으키는 원인이나 행위\n- ( C ) : ( B )에 의해 손실이 생기게 하는 ( A )의 약점"}, {"id": "19-단2", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 2, "q": "단말 인증·통제 솔루션", "a": "NAC", "tags": ["네트워크"], "full": "네트워크에 접속하려는 단말과 사용자를 인증하고, 단말의 보안 상태를 계속 점검·통제해 내부망을 보호하는 솔루션은?"}, {"id": "19-단3", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 3, "q": "공유자원 접근 순서 악용", "a": "Race Condition", "tags": ["시스템"], "full": "여러 프로세스가 공유 자원에 동시에 접근할 때 실행 순서에 따라 결과가 달라지는 상황을 악용하는 공격은?"}, {"id": "19-단4", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 4, "q": "Victim MAC 위조", "a": "ARP 스푸핑", "tags": ["네트워크"], "full": "피해자(Victim)의 IP에 대응하는 MAC 주소를 공격자 MAC으로 위조해, 그 IP로 가는 데이터를 가로채는 공격은?"}, {"id": "19-단5", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 5, "q": "IDS 유형", "a": "네트워크, 호스트", "tags": ["관제·IDS"], "full": "IDS는 네트워크 패킷만 보고 공격을 탐지하는 ( A ) IDS와, 서버에 설치되어 관리자 권한 탈취 같은 공격을 탐지하는 ( B ) IDS로 나뉜다. 빈칸을 채우시오."}, {"id": "19-단6", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 6, "q": "RTO/RPO 결정 절차", "a": "BIA", "tags": ["위험관리"], "full": "BCP 수립 과정에서 업무 중단 시의 재무 손실, 규제 요건 등을 고려해 업무 중요도를 평가하고 RTO·RPO를 정하는 절차는?"}, {"id": "19-단7", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 7, "q": "아파치 로그", "a": "access, error, httpd.conf", "tags": ["웹보안", "시스템"], "full": "Apache 로그에 대한 설명이다. 빈칸을 채우시오.\nApache에는 정상 접속이 기록되는 ( A ) 로그와 오류가 기록되는 ( B ) 로그가 있다. 로그 파일 위치는 설정 파일 ( C )에서 확인할 수 있다."}, {"id": "19-단8", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 8, "q": "필 짐머만 메일 보안", "a": "PGP", "tags": ["메일보안"], "full": "필 짐머만이 만든 이메일 보안 기술로, PEM보다 보안성은 낮다고 평가되지만 공개 구현이 있어 널리 쓰이는 것은?"}, {"id": "19-단9", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 9, "q": "CIA 기준 자산 평가", "a": "중요도", "tags": ["위험관리"], "full": "위험평가 시 자산을 식별한 뒤, 기밀성·무결성·가용성 측면에서 자산의 가치를 평가해 자산의 ( )를 산정한다. 빈칸에 알맞은 용어는?"}, {"id": "19-단10", "round": 19, "meta": "2022.04.23", "type": "단답형", "no": 10, "q": "연결된 세션 가로채기", "a": "세션 하이재킹", "tags": ["네트워크"], "full": "이미 접속되어 연결(세션)이 맺어진 상태를 가로채 사용자인 척하는 공격은?"}, {"id": "19-서11", "round": 19, "meta": "2022.04.23", "type": "서술형", "no": 11, "q": "특수비트 해석", "a": "setuid / setgid / sticky bit", "tags": ["시스템"], "full": "다음 각 파일·디렉터리에 설정된 권한의 의미를 특수 권한(SetUID, SetGID, Sticky bit) 중심으로 설명하시오.\n```\n1) -r-sr-xr-x  root  sys   /etc/chk/passwd\n2) -r-xr-sr-x  root  mail  /etc/chk/mail\n3) drwxrwxrwt  sys   sys   /tmp\n```"}, {"id": "19-서12", "round": 19, "meta": "2022.04.23", "type": "서술형", "no": 12, "q": "개인정보처리방침", "a": "기재사항 4개+, 공개 방법 3개+(홈페이지·사업장 게시·관보/신문·간행물·계약서)", "tags": ["개인정보·법규"], "full": "공공기관이 개인정보 처리방침을 만들 때 포함해야 할 사항을 4가지 이상 쓰고, 이를 정보주체에게 알리는 방법을 3가지 이상 쓰시오."}, {"id": "19-서13", "round": 19, "meta": "2022.04.23", "type": "서술형", "no": 13, "q": "Promiscuous 모드", "a": "의미·스니핑·대응", "tags": ["네트워크"], "full": "다음 로그에 대해 답하시오.\n```\ndevice eth0 entered promiscuous mode\n```\n1) Promiscuous 모드의 의미는?\n2) 이 모드에서 가능한 공격은?\n3) 대응 방법을 1가지 이상 쓰시오."}, {"id": "19-실14", "round": 19, "meta": "2022.04.23", "type": "실무형", "no": 14, "q": "구성도·자산목록 진단", "a": "자산 누락(개발서버), EOS OS 사용", "tags": ["위험관리"], "full": "다음 네트워크 구성과 자산 목록을 보고 ① 자산 식별상의 문제점 1가지와 ② 보안 취약점 1가지를 설명하시오.\n[구성]\n- 인터넷-내부망 사이 방화벽으로 DMZ를 구성하고 web 서버, mail 서버를 둠 (web 앞단에 웹방화벽 추가)\n- 내부망은 방화벽으로 업무망, VDI망, 서버망을 분리\n- 서버망에는 dns, db, was, 개발 서버가 있음\n[자산 목록]\n- db 서버 : AIX 6.4 / krserver1 / 홍과장\n- was 서버 : AIX 8.0 / krserver1 / 김부장\n- dns 서버 : AIX 6.4 / dns_srv / 홍대리\n- web 서버 : Windows 2003 / web1 / 김부장\n- mail 서버 : CentOS 7 / krmail01 / 김사원"}, {"id": "19-실15", "round": 19, "meta": "2022.04.23", "type": "실무형", "no": 15, "q": ".htaccess", "a": "FilesMatch 직접 호출 금지, AddType text/html", "tags": ["웹보안"], "full": "파일 업로드 취약점 대응을 위한 .htaccess 설정이다. 각 설정의 의미를 설명하시오.\n```\n1) <FilesMatch \"\\.(ph|lib|sh)\">\n       Order Allow,Deny\n       Deny from all\n   <\/FilesMatch>\n2) AddType text/html .php .php3 .php4 .phtml\n```"}, {"id": "19-실16", "round": 19, "meta": "2022.04.23", "type": "실무형", "no": 16, "q": "위험평가서", "a": "중요도 평가 목적, 우려사항(위협+취약성), 가능성, 복합 접근법 적용", "tags": ["위험관리"], "full": "다음 위험평가서에 대해 답하시오.\n```\n자산명      | 중요도(C,I,A) | 우려사항                                   | 가능성 | 위험도(C,I,A)\nERP데이터   | H, H, M      | DB 접근통제 위반을 적시에 발견·처리할 수 없음 | H     | H, H, M\n워드문서    | L, L, L      | 보안 규정 부족으로 자산 보호가 미흡할 수 있음  | M     | L, L, L\n```\n1) 자산 중요도 평가의 목적은?\n2) 표의 '우려사항'이란?\n3) 표의 '가능성'이란?\n4) 아래 자산 목록에 본인이 적절하다고 보는 위험분석 기법을 적용해 위험분석 방안을 쓰시오.\n```\nERP데이터 | ERP DB 데이터       | 관리팀장         | H, H, M\nERP서버   | ERP 프로그램 시스템  | 관리팀장         | H, H, M\n워드문서  | 임시 작성 문서       | 관리팀장/생산부장 | L, L, L\n```"}, {"id": "18-단1", "round": 18, "meta": "2021", "type": "단답형", "no": 1, "q": "무선랜 표준", "a": "WPA2", "tags": ["네트워크"], "full": "EAP로 인증하고 AES-CCMP로 암호화하는 무선랜 보안 표준은?"}, {"id": "18-단2", "round": 18, "meta": "2021", "type": "단답형", "no": 2, "q": "VirusTotal 악성코드 분류 툴", "a": "YARA", "tags": ["시스템", "관제·IDS"], "full": "VirusTotal에서 만든 도구로, 악성코드의 문자열·바이너리 패턴으로 규칙을 작성해 악성코드를 식별·분류하는 툴은?"}, {"id": "18-단3", "round": 18, "meta": "2021", "type": "단답형", "no": 3, "q": "SW 취약점", "a": "SQL Injection, XSS, OS 명령어 삽입", "tags": ["웹보안"], "full": "SW 개발보안 취약점에 대한 설명이다. 빈칸에 알맞은 이름을 쓰시오.\n- ( A ) : DB 연동 애플리케이션의 입력값을 조작해 의도하지 않은 쿼리 결과를 얻는 공격\n- ( B ) : 게시판·메일 등에 넣은 악성 스크립트로 다른 사용자의 쿠키 등을 빼가는 공격\n- ( C ) : 검증되지 않은 입력값이 OS 명령어로 실행되는 공격"}, {"id": "18-단4", "round": 18, "meta": "2021", "type": "단답형", "no": 4, "q": "MS 오피스 데이터 전달 프로토콜", "a": "DDE", "tags": ["시스템"], "full": "MS 오피스와 다른 애플리케이션 사이에 데이터를 주고받는 프로토콜로, 엑셀에서 활성화되면 악성 명령 실행에 악용될 수 있는 것은?"}, {"id": "18-단5", "round": 18, "meta": "2021", "type": "단답형", "no": 5, "q": "위험 3요소", "a": "자산, 위협, 취약점", "tags": ["위험관리"], "full": "위험관리 구성 요소에 대한 설명이다. 빈칸을 채우시오.\n- ( A ) : ( B )로부터 보호해야 할 대상\n- ( B ) : ( A )에 손실을 일으키는 원인이나 행위\n- ( C ) : ( B )에 의해 손실이 생기게 하는 ( A )의 약점"}, {"id": "18-단6", "round": 18, "meta": "2021", "type": "단답형", "no": 6, "q": "기업 거버넌스 하위", "a": "정보보안 거버넌스", "tags": ["위험관리"], "full": "기업 거버넌스의 일부로서 정보보호의 전략적 방향을 제시하고, 목표 달성·적절한 위험관리·자산의 책임 있는 사용·보안 프로그램 성과 모니터링을 보장하는 체계를 무엇이라 하는가?"}, {"id": "18-단7", "round": 18, "meta": "2021", "type": "단답형", "no": 7, "q": "C&C 도메인 지속 변경", "a": "DGA", "tags": ["관제·IDS"], "full": "악성코드가 C&C 서버에 접속할 도메인 이름을 정해진 알고리즘으로 계속 새로 만들어, 도메인 차단 기반 탐지를 피하는 기법은?"}, {"id": "18-단8", "round": 18, "meta": "2021", "type": "단답형", "no": 8, "q": "위험분석 절차", "a": "자산 식별, 자산 가치·의존도 평가", "tags": ["위험관리"], "full": "위험분석 절차이다. (A), (B)에 알맞은 단계명을 쓰시오.\n1) ( A ) → 2) ( B ) → 3) 기존 보안대책 평가 → 4) 취약성 평가 → 5) 위험 평가"}, {"id": "18-단9", "round": 18, "meta": "2021", "type": "단답형", "no": 9, "q": "CRLF 헤더 조작 DoS", "a": "Slowloris (Slow HTTP Header)", "tags": ["웹보안", "네트워크"], "full": "HTTP 헤더의 끝을 알리는 개행(CRLF)을 보내지 않고 불완전한 헤더를 조금씩 계속 보내 웹 서버 연결을 고갈시키는 DoS 공격은?"}, {"id": "18-단10", "round": 18, "meta": "2021", "type": "단답형", "no": 10, "q": "앱 특정 화면 이동", "a": "모바일 딥링크", "tags": ["네트워크"], "full": "모바일 앱의 특정 화면으로 바로 이동시키는 기능으로, 악용되면 앱 안의 카드정보·주소 같은 민감정보가 노출될 수 있는 것은?"}, {"id": "18-서11", "round": 18, "meta": "2021", "type": "서술형", "no": 11, "q": "Prepared Statement", "a": "개념, 입력값이 매개변수로 처리되어 SQLi 방지", "tags": ["웹보안"], "full": "SQL Injection 예방을 위한 PreparedStatement에 대해 답하시오.\n(1) PreparedStatement의 개념\n(2) PreparedStatement가 SQL Injection을 막을 수 있는 이유"}, {"id": "18-서12", "round": 18, "meta": "2021", "type": "서술형", "no": 12, "q": "DRDoS", "a": "원리, 기존 DoS와 차이, Unicast RPF", "tags": ["네트워크"], "full": "DRDoS에 대해 설명하시오.\n1) DRDoS의 공격 원리\n2) 기존 DoS와의 차이점\n3) Unicast RPF의 개념"}, {"id": "18-서13", "round": 18, "meta": "2021", "type": "서술형", "no": 13, "q": "패킷 필터링 방화벽", "a": "Ingress 필터링, Tiny Fragment 이유·대응, Stateful 차이", "tags": ["네트워크"], "full": "패킷 필터링 방화벽에 대해 답하시오.\n1) 존재하지 않는(사용되지 않는) 외부 IP로 위조한 스푸핑 공격을 막는 필터링 기법의 이름과 원리\n2) 공격자가 패킷을 아주 작게 쪼개는 Tiny Fragment 공격을 하는 이유\n3) Tiny Fragment 공격 대응 방법\n4) Stateful 패킷 필터링과 일반 패킷 필터링의 차이"}, {"id": "18-실14", "round": 18, "meta": "2021", "type": "실무형", "no": 14, "q": "이메일 로그", "a": "RSA 용도(인증서 검증), SPF·DKIM", "tags": ["시스템", "메일보안"], "full": "다음 이메일 헤더를 보고 물음에 답하시오.\n```\nReceived: from mail-qc0-x232.google.com ([2607:f8b0:400d:c01::232])\n    by mx.google.com with ESMTPS id u123si...\n    (version=TLSv1.2 cipher=ECDHE-RSA-AES128-GCM-SHA256 bits=128/128);   ← 10번째 줄\nReceived-SPF: pass (google.com: domain of sender@gmail.com designates 2607:f8b0:400d:c01::232 as permitted sender)\nAuthentication-Results: mx.google.com;\n    spf=pass smtp.mail=sender@gmail.com;\n    dkim=pass header.i=@gmail.com;\n```\n1) 10번째 줄의 cipher에서 RSA는 무슨 용도로 쓰였는가?\n2) 이 헤더에서 확인할 수 있는 스팸메일 대응 기법 이름과 각각의 동작 원리를 설명하시오."}, {"id": "18-실15", "round": 18, "meta": "2021", "type": "실무형", "no": 15, "q": "리눅스 보안 설정", "a": "계정 임계값(pam), iptables DROP, chown root·chmod 400 /etc/shadow, LimitRequestBody 의미", "tags": ["웹보안", "네트워크", "시스템"], "full": "리눅스 보안 설정에 대해 답하시오.\n1) 계정 잠금 임계값을 설정하는 파일 이름(A)과 빈칸(B)에 들어갈 옵션을 쓰시오.\n```\nauth required /lib/security/pam_tally.so ( B )=5 unlock_time=120 no_magic_root reset\n```\n2) 다음 iptables 룰이 패킷을 차단하도록 (C)에 들어갈 값을 쓰시오.\n```\niptables -A INPUT -p tcp -s 172.30.1.55 --dport 21 -j ( C )\n```\n3) /etc/shadow의 소유자를 root로 바꾸는 명령(D)과, 소유자만 읽을 수 있게 하는 명령(E)을 쓰시오.\n4) 다음 Apache 설정에서 LimitRequestBody 5000000의 의미(F)를 쓰시오.\n```\n<Directory \"/var/www/html/uploads\">\n    LimitRequestBody 5000000\n<\/Directory>\n```"}, {"id": "18-실16", "round": 18, "meta": "2021", "type": "실무형", "no": 16, "q": "DNS 기반 공격 로그", "a": "DNS 증폭 DRDoS (ANY 쿼리)", "tags": ["네트워크", "시스템"], "full": "다음 패킷 로그를 보고 물음에 답하시오.\n```\nDNS standard query 0x2872 ANY cpsc.gov\nDNS standard query 0x2872 ANY cpsc.gov\nDNS standard query 0x2872 ANY cpsc.gov\nDNS standard query 0x2872 ANY cpsc.gov\n```\n1) 어떤 공격인가?\n2) 그렇게 판단한 이유는?\n3) 공격 원리는?\n4) 공격자가 이 기법을 쓰는 이유 2가지는?"}, {"id": "17-단1", "round": 17, "meta": "2021.05.29, 법규 31%로 급등", "type": "단답형", "no": 1, "q": "NTLM 해시 재사용", "a": "Pass the Hash", "tags": ["시스템", "관제·IDS"], "full": "mimikatz 같은 도구로 메모리에서 NTLM/LM 해시를 빼낸 뒤,
